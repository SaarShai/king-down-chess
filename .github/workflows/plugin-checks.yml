name: Validate game and private plugin

on:
  pull_request:
  push:
    # The staging deploy needs CI on the exact commit it publishes.
    branches: [main, staging/first-game]
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA for a change-plan check
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && !inputs.base && 1 || 0 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: node tools/ci-plan.mjs workflow

  verify:
    runs-on: ubuntu-latest
    needs: reuse
    if: needs.reuse.outputs.mode != 'reuse'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: needs.reuse.outputs.mode == 'docs'
        run: npm run test:docs
      - if: needs.reuse.outputs.mode != 'docs'
        run: |
          npm run plugin:db:init-test
          npm run plugin:build
          npm run plugin:server:check
          npm run plugin:smoke
          npm run plugin:check:protocol
          npm run build:vercel
          npm run check:vercel

  checks:
    name: checks / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: reuse
    if: contains(fromJSON('["full","selected"]'), needs.reuse.outputs.mode)
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.reuse.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
      PLAYABLE_BROWSER: ${{ matrix.browser }}
      PLAYABLE_CPU_CANVAS: ${{ matrix.browser == 'webkit' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: matrix.python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-3.13-Pillow-12.3.0
      - if: matrix.python
        run: python3 -m pip install Pillow==12.3.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # Regional mirrors can take longer than APT's idle timeout.
      - run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:2\nhttps://security.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-ci-downloads
          npx playwright install --with-deps "$PLAYABLE_BROWSER"
        timeout-minutes: 10
      - run: npm run plugin:db:init-test
      - if: matrix.browser == 'webkit'
        name: Start WebKit sampler
        run: |
          mkdir -p /tmp/kingdown-check-runs
          nproc
          free -m
          nohup bash tools/ci/webkit-sampler.sh /tmp/kingdown-check-runs/webkit-sampler.log >/dev/null 2>&1 &
      - if: matrix.tests != ''
        run: npm test
        timeout-minutes: 20
        env:
          KINGDOWN_TEST_FILE: ${{ matrix.tests }}
          KINGDOWN_TEST_NO_TYPECHECK: '1'
      # deploy.sh looks for this command to confirm that CI covers the non-GPU defaults.
      - run: npm run check:browser -- --no-gpu
        if: matrix.checks != ''
        timeout-minutes: 26
        env:
          KINGDOWN_CI_BROWSER_CHECKS: ${{ matrix.checks }}
          KINGDOWN_PLUGIN_UI_PART: ${{ matrix.part }}
          DEBUG: ${{ matrix.browser == 'webkit' && 'pw:browser' || '' }}
      - if: matrix.browser == 'webkit' && (failure() || cancelled())
        name: Save kernel log
        run: sudo dmesg -T | tail -n 400 > /tmp/kingdown-check-runs/dmesg.txt || true
      - if: always() && (matrix.browser == 'webkit' || matrix.checks != '')
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: /tmp/kingdown-check-runs/
          retention-days: 7

  record-tree:
    runs-on: ubuntu-latest
    needs: [reuse, verify, checks]
    if: >-
      always() && !cancelled() && needs.reuse.result == 'success' &&
      ((needs.reuse.outputs.mode == 'reuse' && needs.verify.result == 'skipped' && needs.checks.result == 'skipped') ||
       (needs.reuse.outputs.mode == 'docs' && needs.verify.result == 'success' && needs.checks.result == 'skipped') ||
       (contains(fromJSON('["full","selected"]'), needs.reuse.outputs.mode) &&
        needs.verify.result == 'success' && needs.checks.result == 'success'))
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$tree" > "$RUNNER_TEMP/tested-tree"
          echo "hash=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ steps.tree.outputs.hash }}
          path: ${{ runner.temp }}/tested-tree
          if-no-files-found: error
          retention-days: 30
          overwrite: true
