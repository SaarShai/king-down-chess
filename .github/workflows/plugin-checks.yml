name: Validate game and private plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full npm test takes about 15 minutes on the runner, twice main's (Saar, 2026-10-18: "Raise CI limits").
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run plugin:db:init-test
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run plugin:build
      - run: npm run plugin:server:check
      - run: npm run plugin:smoke
      - run: npm run plugin:check:protocol
      - run: npm run build:vercel
      - run: npm run check:vercel

  # The browser checks run beside npm test, so each job keeps its own 15 minutes.
  browser:
    runs-on: ubuntu-latest
    # The Chromium checks run with the step limits times 2 on CI (tools/lib/checks.mjs STEP).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run plugin:db:init-test
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser plugin-oauth plugin-ui plugin-ui-http
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: /tmp/kingdown-check-runs/
          retention-days: 7

  # The web journeys run in their own job beside the plugin checks: together they need more than one 30-minute job.
  browser-web:
    runs-on: ubuntu-latest
    # The Chromium checks run with the step limits times 2 on CI (tools/lib/checks.mjs STEP).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run plugin:db:init-test
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser home account link-game lessons lesson-return workshop workshop-cast
        env:
          PLAYABLE_BROWSER: chromium
      - run: npm run check:browser web-online
        env:
          PLAYABLE_BROWSER: chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-logs
          path: /tmp/kingdown-check-runs/
          retention-days: 7

  browser-webkit:
    runs-on: ubuntu-latest
    # WebKit runs here with the step limits times 3 (tools/lib/checks.mjs STEP), and then the full plugin-ui check.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYABLE_BROWSER: webkit
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run plugin:db:init-test
      - run: npx playwright install --with-deps webkit
      - name: Start WebKit sampler
        run: |
          mkdir -p /tmp/kingdown-check-runs
          nproc
          free -m
          nohup bash tools/ci/webkit-sampler.sh /tmp/kingdown-check-runs/webkit-sampler.log >/dev/null 2>&1 &
      # Step limits under the 45-minute job limit, so a hung step still leaves time for the kernel log and the
      # sampler upload below (the job limit cancels the whole job). Passing runs take 13-15 and 18-19 minutes.
      - run: npm test
        timeout-minutes: 20
        env:
          KINGDOWN_TEST_FILE: 'tools/plugin-{board,ios-size,preview-size}.test.ts'
      - run: npm run check:browser plugin-ui
        env:
          # The browser's own output goes to the check log, so a WebKit crash or memory kill names its reason
          # (chatgpt-mvp ticket 53: run 39230893586 crashed with no reason; WebKit kills its page at 8192 MB).
          DEBUG: pw:browser
        timeout-minutes: 24
      - run: npm run check:browser web-online
        timeout-minutes: 4
      - name: Save kernel log
        if: failure() || cancelled()
        run: sudo dmesg -T | tail -n 400 > /tmp/kingdown-check-runs/dmesg.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-sampler
          path: /tmp/kingdown-check-runs/webkit-sampler.log
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-check-logs
          path: /tmp/kingdown-check-runs/
          retention-days: 7

  browser-firefox:
    runs-on: ubuntu-latest
    # Firefox uses the CI step limits times 3 for the web journey (tools/lib/checks.mjs STEP).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kingdown_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kingdown_plugin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYABLE_BROWSER: firefox
      PLUGIN_TEST_DATABASE_URL: postgresql://kingdown_test:local_test_only@127.0.0.1:5432/kingdown_plugin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run plugin:db:init-test
      - run: npx playwright install --with-deps firefox
      - run: npm run check:browser web-online
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-check-logs
          path: /tmp/kingdown-check-runs/
          retention-days: 7
