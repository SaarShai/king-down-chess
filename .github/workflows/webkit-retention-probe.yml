name: WebKit retention probe
on:
  push:
    branches: ['claude/webkit-crash-460']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYABLE_BROWSER: webkit
      KINGDOWN_TEST_FILE: tools/webkit-retention-probe.test.ts
      NODE_OPTIONS: --import ${{ github.workspace }}/tools/probe-retention-handles.mjs
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-probe
          path: /tmp/kingdown-check-runs/
