<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Trailer soundtrack</title>
<!-- ?play renders the soundtrack in the page and plays it (?only=music|sfx for a stem). The render tool calls window.renderAudio(). -->
<body style="background:#111; color:#ddd; font: 15px system-ui; padding: 24px">
<p id="state">Rendering…</p>
<audio id="player" controls style="width: 100%"></audio>
<script type="module">
import { renderSoundtrack, toWav } from './audio/mix.mjs';
const q = new URLSearchParams(location.search);
window.renderAudio = async (opts = {}) => {
  const bytes = new Uint8Array(toWav(await renderSoundtrack(opts)));
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
if (q.has('play')) {
  const buf = await renderSoundtrack({ only: q.get('only') });
  player.src = URL.createObjectURL(new Blob([toWav(buf)], { type: 'audio/wav' }));
  state.textContent = `Ready: ${buf.duration.toFixed(1)} s`;
} else state.textContent = 'Add ?play to render and listen.';
</script>
</body>
</html>
