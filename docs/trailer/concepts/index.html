<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trailer concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05060a; }
  #fx { position: absolute; inset: 0; }
  #over { position: absolute; inset: 0; pointer-events: none; }
  /* ---- digital cards ---- */
  #cards { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 40%; }
  .card { position: absolute; width: 400px; height: 560px; transform-style: preserve-3d; }
  .card-inner { position: absolute; inset: 0; border-radius: 30px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #1d2331 0%, #0b0d13 70%);
    box-shadow: 0 50px 90px rgba(0,0,0,.65), 0 0 60px var(--aura); }
  .card-inner::before { content: ''; position: absolute; inset: 0; border-radius: 30px; padding: 4px; z-index: 6;
    background: var(--metal); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }
  .card-inner::after { content: ''; position: absolute; inset: 11px; border-radius: 22px; z-index: 6;
    border: 1px solid rgba(255,255,255,.12); pointer-events: none; }
  .art { position: absolute; left: 16px; right: 16px; top: 16px; height: 392px; border-radius: 20px; overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 60%; }
  .art::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 70px rgba(0,0,0,.65), inset 0 -120px 80px -40px rgba(8,10,16,.95); }
  .art canvas { position: absolute; inset: 0; mix-blend-mode: screen; }
  .gem { position: absolute; left: 50%; top: 356px; width: 92px; height: 92px; margin-left: -46px; z-index: 7; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a4150, #0c0f16 70%); box-shadow: 0 0 0 3px var(--rim), 0 0 30px var(--glow), inset 0 0 18px rgba(0,0,0,.8); }
  .gem img { position: absolute; inset: 10px; width: 72px; height: 72px; filter: drop-shadow(0 0 8px var(--glow)); }
  .name { position: absolute; left: 0; right: 0; top: 462px; text-align: center; z-index: 7;
    font: 700 36px/1 Cinzel, Georgia, serif; letter-spacing: .22em; text-indent: .22em;
    background: linear-gradient(180deg, #fff6dc 0%, #f2c46b 45%, #a8661e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.8)); }
  .rule { position: absolute; left: 90px; right: 90px; top: 516px; height: 1px; z-index: 7;
    background: linear-gradient(90deg, transparent, var(--rim), transparent); }
  .rule::after { content: ''; position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--rim); }
  .foil { position: absolute; inset: 0; z-index: 8; mix-blend-mode: color-dodge; opacity: .5; border-radius: 30px;
    -webkit-mask: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.18) 60%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.28));
    background:
      repeating-linear-gradient(115deg, rgba(255,0,140,.35) 0%, rgba(255,210,0,.3) 7%, rgba(0,255,170,.3) 14%, rgba(0,160,255,.35) 21%, rgba(200,0,255,.3) 28%),
      repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.35) 0 1px, transparent 1px 7px);
    background-size: 260% 260%, 100% 100%; background-blend-mode: overlay; }
  .glare { position: absolute; inset: 0; z-index: 9; mix-blend-mode: overlay; border-radius: 30px;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.75), rgba(255,255,255,0) 42%); }
  .card.fire  { --metal: linear-gradient(135deg, #ffe0b0, #d9771f 22%, #5b230a 45%, #ff9f45 68%, #fff0d0 88%); --rim: #f3a04a; --glow: rgba(255,120,30,.8); --aura: rgba(255,90,20,.35); }
  .card.earth { --metal: linear-gradient(135deg, #f2f0c0, #8fa23a 22%, #2c3a10 45%, #c9b25a 68%, #fbf3cf 88%); --rim: #c7c26a; --glow: rgba(170,210,80,.75); --aura: rgba(120,170,40,.3); }
  .card.water { --metal: linear-gradient(135deg, #f0fbff, #7fcff0 22%, #173a5a 45%, #a6e8ff 68%, #ffffff 88%); --rim: #9fe3ff; --glow: rgba(90,210,255,.85); --aura: rgba(60,190,255,.35); }
  /* ---- hologram ---- */
  .holo { position: absolute; transform-origin: 50% 100%; mix-blend-mode: screen; }
  .holo img { display: block; width: 100%;
    filter: grayscale(1) sepia(1) hue-rotate(155deg) saturate(5) brightness(1.25) contrast(1.1) drop-shadow(0 0 22px rgba(90,230,255,.95));
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 3px, rgba(0,0,0,.45) 3px 5px); mask: repeating-linear-gradient(180deg, #000 0 3px, rgba(0,0,0,.45) 3px 5px); }
  .beam { position: absolute; mix-blend-mode: screen; filter: blur(3px);
    background: linear-gradient(0deg, rgba(120,235,255,.55), rgba(120,235,255,0)); clip-path: polygon(38% 100%, 62% 100%, 100% 0, 0 0); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="cards"></div>
  <canvas id="over" width="1920" height="1080"></canvas>
</div>
<script type="module" src="./concepts.mjs"></script>
</body>
</html>
