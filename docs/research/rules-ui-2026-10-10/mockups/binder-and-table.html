  });
  // drag a rule from the drawer onto the card
  document.addEventListener('dragstart', (e) => { const t = e.target.closest('.tseal'); if (t) { e.dataTransfer.setData('text/plain', t.dataset.a); S.traySel = t.dataset.a; } });
  document.addEventListener('dragover', (e) => { if (e.target.closest('.card.front')) e.preventDefault(); });
  document.addEventListener('drop', (e) => { if (e.target.closest('.card.front')) { e.preventDefault(); stamp(e.dataTransfer.getData('text/plain')); } });

  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    const k = e.key;
    if (k === 'm' || k === 'M') { const m = document.getElementById('menu'); if (m.hidden) openMenu(); else m.hidden = true; return; }
    if (k === 'Escape') {
      if (!document.getElementById('menu').hidden) { document.getElementById('menu').hidden = true; return; }
      if (S.pop) S.pop = null; else if (S.sheet) S.sheet = null; else if (S.traySel) S.traySel = null; else if (S.trayOpen) S.trayOpen = false; else if (S.select) S.select = null; else if (S.brush) S.brush = null; else if (S.focus != null || S.knot) { S.focus = null; S.knot = null; } else if (S.view !== 'lib') { back(); return; }
      render(); return;
    }
    if ((k === 'f' || k === 'F') && S.view === 'piece') { S.flipped = !S.flipped; render(); return; }
    if (k.startsWith('Arrow')) {
      const b = document.activeElement;
      const grid = b && b.closest('#hits, .cells');
      if (!grid) return;
      const all = [...grid.children], i = all.indexOf(b), n = grid.id === 'hits' ? 8 : 7;
      const j = i + ({ ArrowLeft: -1, ArrowRight: 1, ArrowUp: -n, ArrowDown: n }[k]);
      if (all[j]) { all[j].focus(); e.preventDefault(); }
    }
  });
  window.addEventListener('resize', () => { const p = document.body.classList.contains('phone'); if (p !== isPhone()) render(); else fitDesktop(); });

  /* ================= OTHER OPENERS ================= */
  function openKing(id) {
    resetTable();
    S.view = 'king'; S.tab = 'kings'; S.item = id;
    S.design = designOf(id === 'mud' ? 'rook' : 'paladin'); S.sq = defaultSq(S.design.base);
    S.seat = id; S.threats = id === 'frost';
    S._enter = S._ripple = true;
  }
  function openCard(id) {
    resetTable();
    S.view = 'card'; S.tab = 'cards'; S.item = id;
    S.design = designOf('paladin'); S.sq = 'd4'; S.slot = id;
    S.threats = id === 'Freeze';
    S._enter = S._ripple = true;
  }
  function openSeal(a) {
    resetTable();
    S.view = 'seal'; S.tab = 'rules'; S.item = a;
    if (a === 'movesLike') applyMyPawnQueen('d4', true);
    else { const k = BX[a].seen[0]; S.design = designOf(k); S.sq = defaultSq(k); S.threats = !!SC.get(PIECES[k].scene).threats; }
    S.focus = S.design.rules.findIndex((r) => r.a === a);
    S._enter = S._ripple = true;
  }
  function openLaw(id) { resetTable(); S.view = 'law'; S.tab = 'rules'; S.item = id; S.design = null; S._enter = true; }
  function applyMyPawnQueen(sq, noYours) {
    S.design = designOf('pawn');
    S.design.copy = true;
    S.design.squares = clone(SC.patterns.mypawn.squares);
    S.design.rules = canonical([...S.design.rules, { a: 'movesLike', pill: 'queen', when: M.blockOf('movesLike').when }]);
    S.sq = sq;
    if (!noYours && !S.yours.some((y) => y.design.base === 'pawn')) S.yours.push({ id: 1, design: S.design, sq });
  }

  /* ================= STATES (?state=) ================= */
  const STATES = {
    binder: ['The opening screen: the binder.', () => {}],
    'card-paladin': ['The Paladin card and its table.', () => openPiece('paladin')],
    hero: ['The Paladin: why d7 (the Receipt).', () => { openPiece('paladin'); S.select = 'd7'; }],
    'hero-isolate-1': ['Rule I alone on the card and the table.', () => { openPiece('paladin'); S.select = 'd7'; S.focus = 0; }],
    'pawn-e2': ['The Pawn: e2, with a knight on d3.', () => openPiece('pawn')],
    'pawn-brush': ['The Pawn with the Both brush armed (no copy yet).', () => { openPiece('pawn'); S.brush = 'both'; }],
    'pawn-painted': ['MY PAWN: Both painted, mirrored.', () => { openPiece('pawn'); S.brush = 'both'; makeCopy(true); S.design.squares = clone(SC.patterns.mypawn.squares); snap('paint'); }],
    'pawn-tray': ['Add a rule: the drawer, with a preview on d4.', () => { STATES['pawn-painted'][1](); S.brush = null; S.sq = 'd4'; S.trayOpen = true; S.traySel = 'movesLike'; }],
    'pawn-stamped': ['MY PAWN with "moves like a queen": its lines sleep on e2.', () => { STATES['pawn-painted'][1](); S.brush = null; applyMyPawnQueen('e2', true); S.yours = [{ id: 1, design: S.design, sq: 'e2' }]; S._stamped = 'movesLike'; snap('rule'); }],
    'pawn-d4': ['MY PAWN on d4: the lines wake, a gold knot.', () => { STATES['pawn-stamped'][1](); S._stamped = false; S.sq = 'd4'; S.yours[0].sq = 'd4'; }],
    'pawn-d8': ['MY PAWN on d4: why d8 (moves like + becomes).', () => { STATES['pawn-d4'][1](); S.select = 'd8'; }],
    flip: ['The back of the Paladin card: its worth.', () => { openPiece('paladin'); S.flipped = true; }],
    peek: ['Hold the original behind MY PAWN.', () => { STATES['pawn-painted'][1](); S.brush = null; S.peek = true; }],
    'rook-leap': ['The Rook with the Mud king and Leap armed.', () => { openPiece('rook'); S.seat = 'mud'; S.armed = 'Leap'; S.select = 'd5'; }],
    echo: ['The Paladin with Leap: it adds nothing.', () => { openPiece('paladin'); S.seat = 'mud'; S.armed = 'Leap'; }],
    'freeze-targets': ['A LAB Freeze card waits for a target.', () => { openPiece('paladin'); S.slot = 'Freeze'; S.threats = true; }],
    'freeze-card': ['A LAB Freeze card played on c6.', () => { openPiece('paladin'); S.slot = 'Freeze'; S.threats = true; S.cardPlayed = 'c6'; }],
    tools: ['The ⋯ tools: Threats, Stir, Clear.', () => { openPiece('paladin'); S.pop = { type: 'tools', x: 807, y: 590 }; }],
    beast: ['MY BEAST: two rules combine (gold knot).', () => { openPiece('beast'); makeCopy(true); S.design.rules = canonical([...S.design.rules, { a: 'removedAfter', pill: 'piece', when: { on: 'takes' } }]); S.select = 'e5'; }],
    'beast-cancel': ['MY BEAST: "anything" stops "takes again".', () => { STATES.beast[1](); S.design.rules[1].pill = 'any'; }],
    kings: ['The Kings page.', () => { S.tab = 'kings'; }],
    mud: ['The Mud king on the stage.', () => { openKing('mud'); }],
    frost: ['The Frost king: Freeze on c6, the marks stay.', () => { openKing('frost'); S.armed = 'Freeze'; S.cardPlayed = 'c6'; }],
    cards: ['The Cards page (LAB).', () => { S.tab = 'cards'; }],
    'card-freeze': ['The Freeze card (LAB) on the stage.', () => { openCard('Freeze'); }],
    'card-rage': ['A card with versions: Rage | B.', () => { openCard('RageB'); }],
    rules: ['The Rules page.', () => { S.tab = 'rules'; }],
    'seal-linespass': ['One piece rule: its lines pass over pieces.', () => { openSeal('linesPass'); }],
    'law-promo': ['One table rule: promotion.', () => { openLaw('promo'); }],
    'new-piece': ['NEW PIECE with the Move brush.', () => { openPiece('new'); }],
    'phone-binder': ['Phone: the binder.', () => {}],
    'phone-card': ['Phone: the Paladin card.', () => openPiece('paladin')],
    'phone-paint': ['Phone: the paint sheet on MY PAWN.', () => { STATES['pawn-painted'][1](); S.sheet = 'paint'; }],
    'phone-receipt': ['Phone: why d7.', () => { openPiece('paladin'); S.select = 'd7'; S.sheet = 'receipt'; }],
    'phone-add': ['Phone: add a rule.', () => { STATES['pawn-painted'][1](); S.brush = null; S.sheet = 'seals'; S.traySel = 'movesLike'; }],
  };
  function applyState(id) {
    S = S0(); hist = [];
    const st = STATES[id];
    if (st) st[1]();
    S._fly = null;
  }
  function openMenu() {
    const m = document.getElementById('menu');
    document.getElementById('menu-states').innerHTML = Object.entries(STATES).map(([id, [w]]) => `<a href="?state=${id}" data-state="${id}"><code>${id}</code>${esc(w)}</a>`).join('');
    m.hidden = false;
  }
  document.getElementById('menu').addEventListener('click', (e) => {
    const a = e.target.closest('[data-state]');
    if (a) { e.preventDefault(); history.replaceState(null, '', '?state=' + a.dataset.state); applyState(a.dataset.state); document.getElementById('menu').hidden = true; render(); return; }
    if (e.target.id === 'menu') e.currentTarget.hidden = true;
  });
  document.getElementById('rm').addEventListener('change', (e) => document.body.classList.toggle('rm', e.target.checked));
  document.getElementById('cbx').addEventListener('change', (e) => document.body.classList.toggle('cb', e.target.checked));

  const q = new URLSearchParams(location.search).get('state');
  applyState(q && STATES[q] ? q : 'binder');
  render();
  window.KDB = { S: () => S, applyState, render, STATES };
})();
</script>
</body>
</html>
