<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proving Ground</title>
<meta name="description" content="King Down Workshop mockup A: the board is the editor. Paint tiles, press rule seals, seat a king, lay a LAB card.">
<link rel="stylesheet" href="shared/grammar.css">
<style>
/* ================= base ================= */
html, body { margin: 0; height: 100%; }
body { background: var(--floor-base) var(--floor); color: var(--ink); font: var(--fs-md)/var(--lh) var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .07 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(122, 87, 18, .10) 100%); }
* { box-sizing: border-box; }
button { font: inherit; font-weight: 700; min-height: 40px; padding: 8px 14px; color: var(--ink); cursor: pointer;
  background: linear-gradient(var(--vellum), #efe4cc); border: 1px solid var(--stone-700); border-radius: var(--radius);
  box-shadow: var(--lift), inset 0 1px 0 rgba(255,255,255,.8); }
button.primary { color: var(--vellum); background: linear-gradient(var(--accent-bright), var(--accent)); border-color: var(--accent-deep);
  box-shadow: 0 2px 0 var(--accent-deep), inset 0 1px 0 rgba(255,220,200,.35); letter-spacing: .01em; }
button.primary:hover { background: linear-gradient(#a8443a, var(--accent-bright)); }
button.quiet { background: transparent; box-shadow: none; border-color: var(--stone-500); font-weight: 400; }
button.quiet:hover:not(:disabled) { background: rgba(255,255,255,.35); }
button:disabled { opacity: .45; cursor: default; }
button.bare { background: none; border: 0; box-shadow: none; padding: 0; min-height: 0; font-weight: 400; }
.cinzel { font-family: var(--font-display); letter-spacing: var(--track-display); }
img { -webkit-user-drag: none; user-select: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ================= stage (desktop 1440 x 900) ================= */
#frame { position: relative; z-index: 1; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
.region { position: absolute; }

/* 1 top bar */
#top { left: 0; top: 0; width: 100%; height: 56px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; gap: 8px; }
#top .title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; display: flex; align-items: center; gap: 14px;
  font: 600 18px/1 var(--font-display); letter-spacing: .08em; color: var(--ink); }
#top .title i { display: block; width: 46px; height: 7px; background:
  linear-gradient(90deg, transparent, var(--gold) 70%) center / 100% 1px no-repeat; position: relative; }
#top .title i::after { content: ''; position: absolute; right: -3px; top: 50%; width: 6px; height: 6px; background: var(--gold); transform: translateY(-50%) rotate(45deg); }
#top .title i.r { transform: scaleX(-1); }
#top .sp { flex: 1; }
#top button { min-height: 44px; padding: 6px 16px; }
#top .icon-btn { display: none; }

/* 2 plinth column: the name, the figure on a plain stone base, the rule lines */
#plinth { left: 24px; top: 64px; width: 336px; height: 676px; }
.nameband { position: absolute; left: 0; right: 0; top: 8px; height: 60px; display: flex; flex-direction: column; justify-content: center; padding: 0 4px; }
.nameband .row { display: flex; align-items: center; gap: 10px; }
.nameband h2 { margin: 0; font: 600 var(--fs-2xl)/1.05 var(--font-display); letter-spacing: .08em; white-space: nowrap; }
.nameband h2.long { font-size: 25px; }
.nameband .from { font-size: var(--fs-xs); color: var(--ink-soft); margin-top: 2px; }
.nameband::after { content: ''; position: absolute; left: 4px; right: 40px; bottom: -4px; height: 1px; background: linear-gradient(90deg, var(--gold), rgba(201,154,62,0)); }
.nameband.is-copy::after { background: linear-gradient(90deg, var(--stone-500), rgba(138,128,114,0)); }
.nameband.stamp h2 { animation: namestamp var(--dur-3) var(--ease-spring) both; }
@keyframes namestamp { 0% { transform: scale(1.18) rotate(-2deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.nameband .weigh { margin-left: auto; min-height: 44px; padding: 4px 12px; font-weight: 400; display: inline-flex; align-items: center; gap: 6px; }

.figure { position: absolute; left: 0; right: 0; top: 72px; height: 236px; display: grid; justify-items: center; align-items: end; pointer-events: none; }
.figure img { height: 236px; max-width: 300px; object-fit: contain; filter: var(--rim) drop-shadow(0 10px 8px rgba(29,25,21,.18)); position: relative; z-index: 2; }
.figure .halo { position: absolute; left: 50%; top: 54%; width: 300px; height: 300px; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(255,250,236,.95), rgba(255,248,230,.5) 55%, rgba(255,248,230,0)); z-index: 1; }
.figure.enter img { animation: figin var(--dur-4) var(--ease-out) both; }
@keyframes figin { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
img[src$="pawn-w.webp"] { clip-path: inset(0 1.4% 0 0); } /* the art has a stray mark at its right edge */

/* the plain stone base under the figure (no sockets: the rule lines are the only place for rules) */
.stone { position: absolute; left: 48px; width: 240px; top: 290px; height: 46px; }
.stone .top { position: absolute; left: 0; right: 0; top: 0; height: 18px; clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, #d6ccb8 0%, var(--stone-300) 35%, var(--stone-500) 100%); }
.stone .top::after { content: ''; position: absolute; left: 50%; top: 2px; width: 140px; height: 12px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(29,25,21,.42), rgba(29,25,21,0)); }
.stone .top.lit::before { content: ''; position: absolute; left: 50%; top: 1px; width: 120px; height: 13px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(233,192,113,.9), rgba(233,192,113,0)); z-index: 1; }
.stone .front { position: absolute; left: 0; right: 0; top: 18px; height: 28px; border-radius: 0 0 4px 4px;
  background: linear-gradient(180deg, #5a5147 0%, var(--stone-700) 30%, #403931 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 14px 18px -8px rgba(29,25,21,.55), 0 2px 0 #2c2620; }
.stone .front::before { content: ''; position: absolute; left: 6px; right: 6px; top: 5px; bottom: 5px; border: 1px solid rgba(201,154,62,.5); border-radius: 2px; pointer-events: none; }
.stone.shake .front { animation: shake 160ms linear; }
@keyframes shake { 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }

/* the rule lines: a 44px seal and its sentence. A gold bracket in the left gutter ties two rules that combine. */
.lines { position: absolute; left: 0; right: 0; top: 352px; padding-left: 22px; }
.sline { position: relative; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 6px 6px; cursor: pointer; border-radius: 8px; }
.sline + .sline { box-shadow: 0 -1px 0 rgba(43,38,33,.07); }
.sline:hover { background: rgba(255,255,255,.3); }
.sline.is-focus { background: linear-gradient(90deg, rgba(233,192,113,.34), rgba(233,192,113,0)); }
.sline.is-other { opacity: .45; }
.sline .sl-seal { flex: none; width: 44px; height: 44px; line-height: 0; }
.sline .sl-seal .kd-seal { width: 44px; height: 44px; }
.sline.stamping .sl-seal { animation: sealstamp var(--dur-3) var(--ease-spring) both; position: relative; }
.sline.stamping .sl-seal::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 8px solid rgba(156,58,45,.5); animation: waxring 420ms var(--ease-out) both; }
@keyframes sealstamp { from { transform: scale(1.35) rotate(-8deg); } to { transform: none; } }
@keyframes waxring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }
.lines.bounce { animation: bounce 260ms linear; }
@keyframes bounce { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.sline .txt { display: grid; gap: 4px; min-width: 0; }
.sline .l1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sline .l2 { font-size: var(--fs-md); line-height: 1.3; }
/* a value reads as plain words until the line is hovered or focused; then it shows as a pill */
.sline .pill { position: relative; cursor: pointer; border-color: transparent; background: none; padding-left: 2px; padding-right: 2px; text-decoration: underline dotted var(--stone-500); text-underline-offset: 3px; }
.sline .pill::before { content: ''; position: absolute; inset: -12px -6px; }
.sline:hover .pill, .sline:focus-within .pill, .sline.is-focus .pill, .sline .pill.is-open { border-color: var(--stone-500); background: var(--vellum); padding-left: 10px; padding-right: 9px; text-decoration: none; }
.sline .pill:hover { border-color: var(--gold-ink); }
.sline.unroll .plate, .sline.unroll .flag { animation: unroll var(--dur-2) var(--ease-out) both; }
@keyframes unroll { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.choices { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px 10px 62px; }
.choices .pill { cursor: pointer; min-height: 32px; }
.sline.add { color: var(--ink-soft); }
.sline.add .sl-seal { display: grid; place-items: center; border-radius: 50%; border: 1.5px dashed var(--stone-500); color: var(--accent); font: 400 24px/1 var(--font-body); }
.sline.add b { color: var(--accent); font-weight: 700; }
.sline.empty { min-height: 52px; cursor: default; pointer-events: none; }
.sline.empty .sl-seal { border-radius: 50%; border: 1.5px dotted var(--stone-300); }
.sline.empty .txt { width: 150px; height: 1px; border-top: 1.5px dotted var(--stone-300); }
.kbr { position: absolute; left: 0; z-index: 3; padding: 0; min-height: 0; background: none; border: 0; box-shadow: none; line-height: 0; cursor: pointer; }
.kbr .knot { display: block; }
.kbr.knot-unknown { opacity: 0; pointer-events: none; transition: opacity var(--dur-2); }
.kbr.knot-unknown.show { opacity: 1; pointer-events: auto; }
.also { position: absolute; left: 4px; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--ink-soft); }
.also .ac { width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; padding: 0; min-height: 0; background: none; border: 0; box-shadow: none; }
.also .ac .coin { width: 32px !important; height: 32px !important; }
.also .ac .mini-card { width: 22px; height: 31px; }
.weigh-pop { position: absolute; right: 0; top: 70px; width: 300px; padding: 14px 16px; background: var(--vellum); border-radius: var(--radius);
  box-shadow: var(--shadow-float); display: grid; grid-template-columns: 48px 1fr; gap: 4px 12px; align-items: center; z-index: 30; }
.weigh-pop .medal { grid-row: span 2; width: 48px; height: 48px; }
.weigh-pop b { font: 600 18px/1.2 var(--font-display); letter-spacing: .04em; }
.weigh-pop small { color: var(--ink-soft); }

/* item views: card, seal, law, king (their words sit in the right column) */
.bigcard { position: absolute; left: 48px; top: 76px; width: 240px; border-radius: 12px; background: var(--vellum);
  box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 16px 30px -10px rgba(43,38,33,.45), 0 0 0 1px var(--stone-300); overflow: hidden; padding-bottom: 16px; }
.bigcard .art { height: 168px; background-size: cover; background-position: center; border-bottom: 2px solid var(--gold); }
.bigcard .art.back { background-image: url(assets/cards/back.jpg); }
.bigcard .ttl { margin: 12px 14px 0; text-align: center; font: 600 19px/1.1 var(--font-display); letter-spacing: .08em; }
.bigcard .rule { height: 1px; margin: 8px 40px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.bigcard p { margin: 0 18px; font-size: var(--fs-sm); line-height: 1.35; text-align: center; color: var(--ink); }
.bigcard::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(201,154,62,.6); border-radius: 8px; pointer-events: none; }
.bigseal { position: absolute; z-index: 3; left: 50%; top: 126px; transform: translateX(-50%); width: 168px; height: 168px; filter: drop-shadow(0 14px 12px rgba(29,25,21,.35)); }
.bigseal .kd-seal { width: 168px; height: 168px; }
.tablet { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); width: 240px; padding: 22px 18px 20px; text-align: center; border-radius: 6px 6px 4px 4px;
  background: linear-gradient(180deg, #d8cfbd, var(--stone-300) 40%, #b3a892); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(43,38,33,.25), 0 14px 22px -12px rgba(29,25,21,.6), 0 2px 0 #8a8072; }
.tablet b { display: block; font: 700 20px/1.2 var(--font-display); letter-spacing: .08em; color: #3d362f; text-shadow: 0 1px 0 rgba(255,255,255,.55); margin-bottom: 10px; }
.look-pick { position: absolute; left: 22px; right: 0; }
.look-pick .row { display: grid; grid-template-columns: repeat(4, 72px); gap: 8px; }
.look-pick button { width: 72px; height: 88px; padding: 4px; min-height: 0; background: linear-gradient(#fbf6ea, #efe3c8); border: 1px solid var(--stone-300); box-shadow: 0 2px 0 var(--stone-300); border-radius: 8px; }
.look-pick button.on { border-color: var(--gold-ink); box-shadow: 0 0 0 2px var(--gold-bright), 0 2px 0 var(--stone-500); }
.look-pick img { width: 100%; height: 100%; object-fit: contain; filter: var(--rim); }

/* 3 board */
#boardWrap { left: 384px; top: 64px; width: 672px; height: 672px; }
#boardWrap::before { content: ''; position: absolute; left: 4%; right: 4%; bottom: -26px; height: 50px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(29,25,21,.45), rgba(29,25,21,0)); filter: blur(6px); z-index: -1; }
#rim { position: absolute; inset: 0; border-radius: 6px;
  background: linear-gradient(160deg, #5c534a 0%, var(--stone-700) 40%, #3a332c 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 -1px 0 rgba(0,0,0,.4) inset, 0 22px 40px -18px rgba(20,14,8,.6), 0 3px 0 #2a241e; }
#rim::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(201,154,62,.65); border-radius: 2px; pointer-events: none; }
#field { position: absolute; left: 16px; top: 16px; width: 640px; height: 640px; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
#board { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#board .kdm-pieces image { transition: opacity var(--dur-2); }
#paintfx { position: absolute; inset: 0; pointer-events: none; }
#paintfx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#hits { position: absolute; inset: 0; }
#hits .sq { position: absolute; padding: 0; margin: 0; min-height: 0; background: transparent; border: 0; box-shadow: none; border-radius: 3px; cursor: pointer; }
#hits .sq:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
#hits .sq.is-open { cursor: grab; }
#hits.brush .sq { cursor: crosshair; }
.nub { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: auto; padding: 0; min-height: 0; background: none; border: 0; box-shadow: none; z-index: 5; }
.nub svg { width: 22px; height: 22px; overflow: visible; }
.nub.on svg path { fill: var(--leg-green); }
.files, .ranks { position: absolute; font: 600 12px/1 var(--font-display); color: var(--gold); pointer-events: none; letter-spacing: 0; }
.files { left: 16px; right: 16px; bottom: 0; height: 16px; display: grid; grid-template-columns: repeat(8, 1fr); align-items: center; text-align: center; text-transform: uppercase; }
.ranks { left: 0; top: 16px; bottom: 16px; width: 16px; display: grid; grid-template-rows: repeat(8, 1fr); align-items: center; text-align: center; }
#chev { position: absolute; left: 50%; top: 1px; width: 14px; height: 14px; margin-left: -7px; color: var(--gold); pointer-events: none; }
#notch { position: absolute; right: 0; width: 16px; height: 16px; display: none; pointer-events: none; }
#notch::before { content: ''; position: absolute; right: 2px; top: 2px; width: 10px; height: 12px; background: var(--gold-bright); clip-path: polygon(0 50%, 100% 0, 100% 100%); filter: drop-shadow(0 0 3px rgba(233,192,113,.9)); }
#tryPlaque { position: absolute; left: 8px; top: -14px; z-index: 6; }
#tryPlaque .plaque { height: 26px; box-shadow: 0 2px 6px rgba(29,25,21,.25); animation: tagin var(--dur-3) var(--ease-out) both; }
#tryPlaque .plaque.lab { background: linear-gradient(var(--accent-bright), var(--accent)); color: var(--vellum); border-color: var(--accent-deep); font-weight: 700; letter-spacing: .04em; }
#tryPlaque .plaque.lab svg { color: var(--vellum); }
#toast { position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 10px); z-index: 50; padding: 10px 18px; border-radius: var(--radius); background: var(--vellum);
  border: 1px solid var(--stone-300); box-shadow: var(--shadow-float); font-size: var(--fs-md); opacity: 0; pointer-events: none; transition: opacity var(--dur-2), transform var(--dur-2) var(--ease-out); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast svg { color: var(--stone-700); }
.lockflash { position: absolute; display: grid; place-items: center; color: var(--vellum); background: rgba(29,25,21,.55); border-radius: 4px; animation: lockflash 420ms ease both; pointer-events: none; }
@keyframes lockflash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
/* 4 right column: brushes (also the key) at the top, the Why tag floats in the middle, the Try tray sits at the bottom */
#right { left: 1080px; top: 64px; width: 336px; height: 676px; display: flex; flex-direction: column; }
#brushes { position: relative; flex: none; display: flex; justify-content: center; gap: 12px; padding-top: 16px; }
#brushes:empty { display: none; }
.brush { width: 80px; padding: 0; min-height: 0; background: none; border: 0; box-shadow: none; display: grid; justify-items: center; gap: 4px; font-weight: 400;
  transition: transform var(--dur-2) var(--ease-out), opacity var(--dur-2); }
.brush .tile { width: 80px; height: 80px; border-radius: 10px; display: grid; place-items: center; position: relative; }
.brush .tile::before { content: ''; position: absolute; inset: 4px; border-radius: 8px; box-shadow: 0 6px 10px -4px rgba(29,25,21,.35); pointer-events: none; }
.brush .w { font-size: var(--fs-sm); color: var(--ink); letter-spacing: .02em; }
.brush:hover .tile { transform: translateY(-2px); }
.brush.armed { transform: translateY(-2px); }
.brush.armed .tile::after { content: ''; position: absolute; inset: 2px; border-radius: 9px; box-shadow: 0 0 0 3px var(--gold-bright), 0 0 0 4px var(--ink), 0 0 16px rgba(233,192,113,.8); }
.brush.dim { opacity: .45; }
/* the live key: only the other mark kinds that are on the board now */
#keyrow { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; padding: 10px 8px 0; }
#keyrow:empty { display: none; }
#keyrow .k { display: grid; grid-template-rows: 38px auto; align-items: center; justify-items: center; gap: 2px; font-size: var(--fs-xs); color: var(--ink-soft); min-width: 44px; }
#keyrow .k svg { display: block; }
#tools { flex: none; display: none; align-items: flex-start; justify-content: center; gap: 12px; padding-top: 14px; }
#tools.on { display: flex; }
#tools .tool { width: 52px; padding: 0; min-height: 0; display: grid; justify-items: center; gap: 4px; background: none; border: 0; box-shadow: none; font-weight: 400; }
#tools .tool .tb { width: 48px; height: 48px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(var(--vellum), #efe4cc); border: 1px solid var(--stone-500); box-shadow: 0 2px 0 var(--stone-500); }
#tools .tool.armed .tb { box-shadow: 0 0 0 3px var(--gold-bright), 0 0 0 4px var(--ink); }
#tools .tool small { font-size: var(--fs-xs); color: var(--ink-soft); white-space: nowrap; }
#tools .done { margin-top: 2px; min-height: 48px; padding: 8px 18px; }
#hint { flex: none; text-align: center; font: italic var(--fs-md)/1.3 var(--font-body); color: var(--ink-soft); padding-top: 10px; }
#hint:empty { display: none; }

/* item words (king, card, seal, law) take the place of the brushes */
#info { flex: none; padding-top: 12px; }
#info:empty { display: none; }
.pline { display: grid; grid-template-columns: 60px 1fr; gap: 6px 14px; align-items: start; padding: 10px 6px; border-radius: 8px; cursor: pointer; }
.pline + .pline { box-shadow: 0 -1px 0 rgba(43,38,33,.07); }
.pline:hover { background: rgba(255,255,255,.3); }
.pline.armed { background: linear-gradient(90deg, rgba(233,192,113,.3), rgba(233,192,113,0)); }
.pline b { display: block; font: 600 16px/1.2 var(--font-display); letter-spacing: .07em; margin-bottom: 2px; }
.pline .pt { font-size: var(--fs-sm); line-height: 1.3; color: var(--ink); }
.pline .mini3 { grid-column: 2; display: flex; align-items: center; gap: 10px; }
.pline .mini3 svg { border-radius: 4px; box-shadow: 0 2px 5px rgba(29,25,21,.35); }
.pline .mini3 small { font-size: var(--fs-xs); color: var(--ink-soft); }
.lab-note { color: var(--accent); font-weight: 700; font-size: var(--fs-sm); display: flex; align-items: center; gap: 8px; }
.lab-note i { display: inline-block; width: 30px; height: 14px; background: linear-gradient(var(--accent-bright), var(--accent)); color: var(--vellum); font: 700 9px/14px var(--font-display); letter-spacing: .12em; text-align: center; font-style: normal; border-radius: 2px; }
.info-p { margin: 12px 0 0; font-size: var(--fs-md); line-height: 1.35; }
.info-p.ex { font: italic 18px/1.35 var(--font-body); color: var(--ink); }
.info-h { margin: 18px 0 6px; font: 600 12.5px/1 var(--font-display); letter-spacing: .1em; color: var(--ink-soft); text-transform: uppercase; }
.twin { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--ink-soft); }
.twin button { padding: 0; min-height: 44px; min-width: 44px; background: none; border: 0; box-shadow: none; display: grid; place-items: center; }
.variant { font-size: var(--fs-sm); color: var(--ink); padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,.35); margin-top: 6px; }
.variant b { font-family: var(--font-display); letter-spacing: .06em; font-size: 13px; margin-right: 6px; }
.seen { display: flex; gap: 14px; align-items: flex-end; }
.seen button { padding: 4px 6px 2px; min-height: 0; background: none; border: 0; box-shadow: none; display: grid; justify-items: center; font: 600 12px/1.2 var(--font-display); letter-spacing: .06em; color: var(--ink); border-radius: 8px; }
.seen button:hover { background: rgba(255,255,255,.4); }
.seen img { height: 64px; filter: var(--rim); }
.lawpills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.lawpills .pill { cursor: pointer; min-height: 32px; }

/* Why tag: floats on the parchment with a soft shadow */
#why { position: relative; flex: none; width: 336px; margin-top: 18px; display: none; }
#why.open { display: block; animation: tagin var(--dur-3) var(--ease-out) both; }
@keyframes tagin { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
.tag { position: relative; min-height: 200px; background: var(--vellum); border-radius: 4px 12px 12px 4px; padding: 12px 14px 14px 24px;
  box-shadow: 0 14px 34px -14px rgba(43,38,33,.45), 0 2px 6px rgba(43,38,33,.08);
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); display: flex; flex-direction: column; }
.tag::before { content: ''; position: absolute; left: 5px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--parchment-deep); box-shadow: inset 0 1px 2px rgba(29,25,21,.5), 0 0 0 1.5px var(--gold); }
.pointer { position: absolute; left: -10px; width: 12px; height: 18px; margin-top: -9px; background: var(--gold-bright); clip-path: polygon(0 50%, 100% 0, 100% 100%); filter: drop-shadow(0 0 2px rgba(122,87,18,.6)); }
.why-h { display: flex; align-items: center; gap: 10px; }
.why-h img.ic { width: 28px; height: 28px; }
.why-h .sqn { font: 600 18px/1 var(--font-display); letter-spacing: .06em; }
.why-h .occ { font-size: var(--fs-sm); color: var(--ink-soft); }
.why-h .count-ring { margin-left: auto; }
.why-h .x { margin-left: 2px; min-height: 44px; width: 44px; height: 44px; padding: 0; border-radius: 50%; font-weight: 400; display: grid; place-items: center; background: none; border: 0; box-shadow: none; font-size: 20px; color: var(--ink-soft); }
.why-h .x:hover { background: rgba(43,38,33,.06); }
.why-sumrow { margin-top: 8px; display: flex; justify-content: center; }
.why-sum .op { font-size: 20px; padding: 0 1px; }
#why .why-sum { gap: 6px; }
#why .why-sum .part > small { max-width: 70px; }
.why-hr { height: 1px; margin: 8px 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.why-steps { display: flex; align-items: center; justify-content: center; gap: 4px; }
.why-steps .mini { width: 80px; height: 56px; border-radius: 4px; background: #2e2822; display: grid; place-items: center; box-shadow: 0 2px 5px rgba(29,25,21,.3); overflow: hidden; }
.why-steps .ar { color: var(--ink-soft); font-size: 14px; }
.why-foot { margin: 8px 0 0; font: italic var(--fs-sm)/1.3 var(--font-body); color: var(--ink-soft); text-align: center; }
.why-act { margin-top: auto; display: flex; gap: 8px; justify-content: center; padding-top: 10px; }
.why-act button { min-height: 44px; }
.why-act .ghost-enemy { display: inline-flex; align-items: center; gap: 8px; border-style: dashed; }
.why-act .ghost-enemy img { width: 26px; height: 26px; opacity: .55; }
.why-solo { display: grid; justify-items: center; gap: 6px; }
.why-solo small { font-size: var(--fs-xs); color: var(--ink-soft); }
.why-swap { display: flex; align-items: center; gap: 8px; justify-content: center; }

/* Try tray: no card, it stands at the foot of the column */
#tray { flex: none; margin-top: auto; padding: 4px 4px 0; display: none; position: relative; }
#tray.open { display: block; }
#tray h3 { margin: 0 0 6px; font: 600 13px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.tokens { display: flex; gap: 14px; align-items: flex-end; }
.tok { width: 56px; height: 64px; padding: 0; min-height: 0; display: grid; justify-items: center; align-items: end; background: none; border: 0; box-shadow: none; position: relative; }
.tok .fig { height: 50px; filter: var(--rim) drop-shadow(0 3px 2px rgba(29,25,21,.25)); position: relative; z-index: 1; margin-bottom: -4px; }
.tok .base { width: 46px; height: 10px; border-radius: 2px; background: linear-gradient(180deg, var(--stone-300), var(--stone-500)); box-shadow: 0 2px 0 var(--stone-700), 0 5px 6px -2px rgba(29,25,21,.4); }
.tok.on .base { box-shadow: 0 0 0 2px var(--gold-bright), 0 2px 0 var(--stone-700); }
.tok .sockc { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px;
  background: radial-gradient(circle at 50% 40%, #ddcfb1, var(--parchment-deep)); box-shadow: inset 0 2px 5px rgba(29,25,21,.45), 0 1px 0 rgba(255,255,255,.7); }
.tok .sockc img { width: 32px; height: 32px; opacity: .28; filter: grayscale(1); }
.tok.cardslot .cs { width: 40px; height: 56px; border-radius: 4px; position: relative; overflow: hidden; margin-bottom: 2px; background: var(--parchment-deep); box-shadow: inset 0 2px 4px rgba(29,25,21,.4); }
.tok.cardslot .cs::before { content: ''; position: absolute; inset: 0; background: url(assets/cards/back.jpg) center/cover; opacity: .3; }
.tok.cardslot .cs.filled { box-shadow: 0 2px 5px rgba(29,25,21,.45), 0 0 0 1px var(--stone-500); background-size: cover; background-position: center; }
.tok.cardslot .cs.filled::before { content: none; }
.tok.cardslot .cs i { position: absolute; right: -11px; top: 4px; width: 36px; transform: rotate(45deg); background: var(--accent); height: 7px; }
.tok.cardslot.on .cs { box-shadow: 0 0 0 3px var(--gold-bright), 0 0 0 4px var(--ink); }
.tok.kingseat { width: auto; height: 64px; align-items: center; }
.tok .coins { display: flex; gap: 6px; }
.tok .coins > span { width: 48px; height: 48px; display: grid; place-items: center; cursor: pointer; }
.trow2 { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.trow2 > button { width: 44px; height: 44px; min-height: 0; padding: 0; display: grid; place-items: center; background: none; border: 0; box-shadow: none; border-radius: 50%; color: var(--ink-soft); }
.trow2 > button:hover { background: rgba(43,38,33,.06); color: var(--ink); }
.trow2 > button.is-on { color: var(--accent); background: rgba(233,192,113,.3); }
.trow2 .tb { margin-left: auto; width: auto; min-height: 44px; padding: 4px 14px; font-weight: 400; }
.picker { position: absolute; left: 0; bottom: calc(100% + 8px); width: 336px; padding: 12px; background: var(--vellum); border-radius: var(--radius); box-shadow: var(--shadow-float); z-index: 30; }
.picker h4 { margin: 0 0 8px; font: 600 12.5px/1 var(--font-display); letter-spacing: .1em; color: var(--ink-soft); }
.picker .row { display: flex; gap: 8px; flex-wrap: wrap; }
.picker button { padding: 2px; min-height: 0; background: none; border: 0; box-shadow: none; display: grid; justify-items: center; gap: 2px; font-weight: 400; font-size: 12px; color: var(--ink-soft); }

/* power coins with an effect glyph (the king emblem is a badge on the rim) */
.pcoin { display: inline-grid !important; place-items: center; }
.pcoin > svg.pg { width: 62%; height: 62%; color: var(--ink); position: relative; z-index: 1; }
.pcoin img.emb { position: absolute; inset: auto; right: -3px; bottom: -3px; width: 36%; height: 36%; max-width: 20px; max-height: 20px; min-width: 14px; min-height: 14px; border-radius: 50%; background: var(--vellum); box-shadow: 0 0 0 1px var(--stone-500); padding: 1px; z-index: 2; }
.pcoin .notches { z-index: 3; }

/* Rules shelf */
#shelf { position: absolute; left: 1080px; top: 64px; width: 336px; height: 672px; z-index: 20; background: var(--vellum); border-radius: var(--radius); box-shadow: var(--shadow-float);
  transform: translateX(380px); opacity: 0; pointer-events: none; transition: transform var(--dur-3) var(--ease-out), opacity var(--dur-3); padding: 10px 14px 14px; display: flex; flex-direction: column; }
#shelf.open { transform: none; opacity: 1; pointer-events: auto; }
#shelf header { display: flex; align-items: center; justify-content: space-between; }
#shelf header h3 { margin: 0; font: 600 18px/1 var(--font-display); letter-spacing: .08em; }
#shelf header button { width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; font-weight: 400; background: none; border: 0; box-shadow: none; font-size: 20px; color: var(--ink-soft); }
.groups { margin-top: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; overflow: auto; min-height: 0; flex: 1 1 auto; align-content: start; }
.grp.wide { grid-column: 1 / -1; }
.grp h5 { margin: 0 0 4px; font: 600 12px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.grp .seals { display: flex; gap: 4px; }
.sbtn { width: 72px; padding: 4px 2px 6px; min-height: 0; background: none; border: 0; box-shadow: none; display: grid; justify-items: center; gap: 4px; font-weight: 400; font-size: 12.5px; line-height: 1.1; color: var(--ink); border-radius: 8px; position: relative; text-align: center; }
.sbtn:hover { background: rgba(233,192,113,.18); }
.sbtn.sel { background: rgba(233,192,113,.32); box-shadow: inset 0 0 0 1.5px var(--gold-ink); }
.sbtn .kd-seal { width: 48px; height: 48px; }
.sbtn.dim { opacity: .45; }
.sbtn.has::after { content: '✓'; position: absolute; right: 8px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--gold-ink); color: var(--vellum); font: 700 11px/18px var(--font-body); text-align: center; box-shadow: 0 0 0 1.5px var(--vellum); }
.sbtn.pulse .kd-seal { animation: kdm-pulse .4s 3 alternate; }
.sentence { margin-top: 8px; padding: 12px; border-radius: var(--radius); background: var(--parchment); display: grid; grid-template-columns: 44px 1fr; gap: 8px 12px; align-items: center; }
.sentence .say { font-size: var(--fs-md); line-height: 1.35; }
.sentence .act { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
.sentence .act button { min-height: 44px; }
.sentence .needs { grid-column: 1 / -1; color: var(--accent); font-size: var(--fs-sm); }

/* 5 ledge: one row of word tabs, then the figures on one stone lip */
#ledge { left: 0; top: 744px; width: 100%; height: 156px; background: linear-gradient(180deg, #e2d1ad, var(--parchment-deep) 30%, #e2d2b0);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 -6px 18px -8px rgba(43,38,33,.3); }
#ledge::before { content: ''; position: absolute; left: 0; right: 0; top: -8px; height: 8px; background: linear-gradient(180deg, #d9cfbd, var(--stone-300));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 rgba(43,38,33,.25); }
.ltabs { position: absolute; left: 24px; top: 4px; height: 36px; display: flex; gap: 22px; z-index: 2; }
.ltab { height: 36px; padding: 0 2px; min-height: 0; background: none; border: 0; box-shadow: none; border-radius: 0; display: inline-flex; align-items: center; gap: 6px;
  font: 600 12.5px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); position: relative; }
.ltab:hover { color: var(--ink); }
.ltab.on { color: var(--ink); }
.ltab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: 2px; height: 3px; border-radius: 2px; background: var(--accent); }
.ltab .lab { display: inline-block; padding: 0 4px; border-radius: 2px; background: linear-gradient(var(--accent-bright), var(--accent)); color: var(--vellum); font: 700 8.5px/13px var(--font-display); letter-spacing: .12em; }
.lrow { position: absolute; left: 0; right: 0; top: 36px; height: 120px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
.lrow::-webkit-scrollbar { display: none; }
.lrow .inner { display: flex; align-items: flex-start; height: 120px; padding: 0 24px; width: max-content; position: relative; }
/* the one stone lip the figures stand on */
.lrow .inner.lip::before { content: ''; position: absolute; left: 24px; right: 24px; top: 72px; height: 8px; border-radius: 2px;
  background: linear-gradient(180deg, #d6ccb8, var(--stone-300) 45%, var(--stone-500)); box-shadow: 0 2px 0 rgba(77,69,60,.55), 0 6px 8px -4px rgba(29,25,21,.4); }
.slot { width: 92px; flex: none; padding: 0; min-height: 0; background: none; border: 0; box-shadow: none; position: relative; height: 120px; font-weight: 400; transition: transform var(--dur-2) var(--ease-out); }
.slot .fig { position: absolute; left: 50%; bottom: 46px; height: 64px; transform: translateX(-50%); filter: var(--rim); max-width: 86px; object-fit: contain; object-position: bottom; z-index: 2; transition: transform var(--dur-2) var(--ease-out); }
.slot:hover .fig, .slot:focus-visible .fig { transform: translateX(-50%) translateY(-4px); }
.slot .nm { position: absolute; left: 0; right: 0; top: 88px; text-align: center; font: 600 12.5px/1.1 var(--font-display); letter-spacing: .06em; color: var(--ink); white-space: nowrap; }
.slot.open .fig { transform: translateX(-50%) translateY(-6px); }
.slot.open::before { content: ''; position: absolute; left: 50%; top: 62px; width: 70px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(233,192,113,.95), rgba(233,192,113,0)); z-index: 1; }
.slot.open .nm::after { content: ''; display: block; width: 28px; height: 2px; margin: 4px auto 0; background: var(--gold-ink); border-radius: 2px; }
.slot .qt { position: absolute; right: 10px; top: 4px; z-index: 3; }
.slot .qt svg { width: 16px; height: 16px; color: var(--stone-700); background: var(--vellum); border-radius: 50%; padding: 2px; box-shadow: 0 0 0 1px var(--stone-500); }
.slot.flash .fig { animation: flash 600ms ease; }
@keyframes flash { 0% { filter: var(--rim) drop-shadow(0 0 0 rgba(233,192,113,0)); } 40% { filter: var(--rim) drop-shadow(0 0 12px rgba(233,192,113,1)); } }
.lsep { flex: none; align-self: stretch; width: 1px; margin: 8px 12px 20px; background: linear-gradient(transparent, var(--gold), transparent); }
.lhead { flex: none; align-self: flex-start; margin-top: 90px; font: 600 12px/1 var(--font-display); letter-spacing: .12em; font-variant: small-caps; color: var(--ink-soft); margin-right: 6px; text-transform: lowercase; font-size: 14px; }
.newtile .fig { opacity: 1; }
.newtile .ghostfig { position: absolute; left: 50%; bottom: 46px; width: 44px; height: 62px; transform: translateX(-50%); z-index: 2; }
.newtile .ghostfig svg { width: 100%; height: 100%; overflow: visible; }
/* reach on hover: a 96px mini board above the slot */
#reachPop { position: fixed; z-index: 90; pointer-events: none; padding: 6px; border-radius: 8px; background: var(--vellum); box-shadow: var(--shadow-float); opacity: 0; transition: opacity var(--dur-1); }
#reachPop.show { opacity: 1; }
#reachPop svg { display: block; border-radius: 4px; }
/* cards fan */
.cfan { display: flex; align-items: flex-start; padding-top: 8px; }
.cface { flex: none; width: 72px; height: 100px; margin-right: -3px; padding: 0; min-height: 0; border: 0; border-radius: 6px; background: var(--vellum); position: relative; overflow: hidden;
  box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 4px 8px -2px rgba(43,38,33,.4), 0 0 0 1px var(--stone-300); transition: transform var(--dur-2) var(--ease-out); font-weight: 400; }
.cface:nth-child(odd) { transform: rotate(-2deg); } .cface:nth-child(even) { transform: rotate(1.5deg) translateY(2px); }
.cface:hover, .cface.open { transform: translateY(-6px) rotate(0); z-index: 5; }
.cface.open { box-shadow: 0 0 0 2px var(--gold-bright), 0 0 0 3px var(--ink), 0 8px 14px -4px rgba(43,38,33,.5); }
.cface .art { height: 64px; background-size: cover; background-position: center; border-bottom: 1px solid var(--gold); }
.cface .art.back { background-image: url(assets/cards/back.jpg); }
.cface .t { padding: 6px 3px 0; font: 600 9.5px/1.1 var(--font-display); letter-spacing: .04em; text-align: center; }
.cface .lab-ribbon { top: 6px; right: -30px; width: 84px; font-size: 7px; line-height: 11px; }
.cface .badge { position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--vellum); box-shadow: 0 0 0 1px var(--power-edge); display: grid; place-items: center; }
.cface .badge img { width: 14px; height: 14px; }
.cstack { flex: none; width: 92px; height: 108px; margin-left: 22px; padding: 0; min-height: 0; background: none; border: 0; box-shadow: none; position: relative; }
.cstack span.c { position: absolute; left: 6px; top: 4px; width: 72px; height: 100px; border-radius: 6px; background: url(assets/cards/back.jpg) center/cover; box-shadow: 0 0 0 1px var(--stone-500), 0 3px 6px -2px rgba(43,38,33,.45); }
.cstack span.c:nth-child(2) { transform: translate(5px, -3px) rotate(3deg); }
.cstack span.c:nth-child(3) { transform: translate(10px, -6px) rotate(6deg); }
.cstack b { position: absolute; left: 18px; top: 38px; z-index: 4; min-width: 48px; padding: 3px 8px; border-radius: 99px; background: var(--vellum); box-shadow: 0 0 0 1px var(--gold-ink), 0 2px 4px rgba(29,25,21,.3); font: 700 15px/1.2 var(--font-body); color: var(--ink); text-align: center; }
.cstack:hover span.c:nth-child(3) { transform: translate(14px, -10px) rotate(9deg); }
.cback { flex: none; align-self: center; margin-left: 4px; min-height: 44px; }
/* rules ledge */
.rgroups { display: flex; gap: 16px; align-items: flex-start; padding-top: 6px; }
.rgrp h6 { margin: 0 0 4px; font: 600 11px/1 var(--font-display); letter-spacing: .1em; color: var(--ink-soft); text-transform: uppercase; white-space: nowrap; }
.rgrp .ss { display: flex; gap: 2px; }
.rgrp button { width: 64px; padding: 2px 0 4px; min-height: 0; background: none; border: 0; box-shadow: none; border-radius: 8px; display: grid; justify-items: center; gap: 3px; font: 400 11.5px/1.1 var(--font-body); color: var(--ink); }
.rgrp button:hover { background: rgba(255,255,255,.35); }
.rgrp button.open { background: rgba(233,192,113,.35); box-shadow: inset 0 0 0 1.5px var(--gold-ink); }
.rgrp button .kd-seal { width: 44px; height: 44px; }
.laws { display: flex; gap: 10px; align-items: flex-start; padding-top: 14px; }
.law { width: 128px; height: 74px; padding: 10px 10px 8px; min-height: 0; border: 0; border-radius: 5px 5px 3px 3px; display: grid; align-content: space-between; justify-items: start; gap: 6px; text-align: left; position: relative;
  background: linear-gradient(180deg, #d8cfbd, var(--stone-300) 45%, #b9ae98); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(43,38,33,.22), 0 2px 0 #8a8072, 0 6px 8px -4px rgba(29,25,21,.45);
  font: 700 12.5px/1.15 var(--font-display); letter-spacing: .04em; color: #3d362f; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.law.open { box-shadow: 0 0 0 2px var(--gold-bright), 0 0 0 3px var(--ink), 0 2px 0 #8a8072; }
.law .pill { font: 400 12px/1.3 var(--font-body); padding: 0 7px; text-shadow: none; }
.lamp { position: absolute; right: 2px; bottom: 0; width: 44px; height: 44px; display: grid; place-items: center; }
.lamp i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #6a6056, #2e2924); box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.5); }
.lamp.on i { background: radial-gradient(circle at 40% 35%, #fff3c9, var(--gold-bright) 45%, var(--gold)); box-shadow: 0 0 8px 2px rgba(233,192,113,.9), 0 0 0 1px var(--gold-ink); }
.law.fixed { width: 210px; font: 400 11.5px/1.25 var(--font-body); letter-spacing: 0; color: #4d453c; }
.law.fixed b { font: 700 12.5px/1 var(--font-display); letter-spacing: .06em; color: #3d362f; display: flex; gap: 5px; align-items: center; }

/* flight overlay */
.fly { position: fixed; z-index: 100; pointer-events: none; filter: var(--rim); object-fit: contain; object-position: bottom; }
.puff { position: fixed; z-index: 101; pointer-events: none; animation: puff 320ms var(--ease-out) both; }
@keyframes puff { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6) translateY(-10px); opacity: 0; } }

/* states menu */
#menu { position: fixed; inset: 0; z-index: 200; background: rgba(29,25,21,.35); display: none; place-items: center; }
#menu.open { display: grid; }
#menu .box { width: 560px; max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); overflow: auto; background: var(--vellum); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); padding: 18px 20px; }
#menu h3 { margin: 0 0 4px; font: 600 18px/1.2 var(--font-display); letter-spacing: .08em; }

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="deut"><feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/></filter></svg>

<script>
(function () {
  'use strict';

  const ICON = (name, size = 20) => M.sigil(name, size);

  const KINGS = { flame: ['Strike', 'Haste'], frost: ['Freeze', 'IceWall'], mud: ['March', 'Leap'], shadow: ['DeathTouch', 'Darkness'], spirit: ['HolyLight', 'Mercy'], stratus: ['Flight', 'Sacrifice'] };
  const KING_ORDER = ['flame', 'frost', 'mud', 'shadow', 'spirit', 'stratus'];
  const F = (side, notKing, cost, captures, uses, duration, caps, live, when) => ({ targets: { side, notKing }, cost, captures, uses, duration, caps, live, when });
  const POWER = {
    Freeze: { t: 'Freeze', king: 'frost', uses: 1, text: 'freeze an enemy piece (not the king), then make your move: the frozen piece cannot move on its next turn',

    HolyLight: { t: 'Holy Light', king: 'spirit', uses: Infinity, always: true, text: 'enemy pawns cannot take your king; your pieces beside, in front of or behind it cannot be taken' },

  };
  const CF = (side, notKing, cost, captures, duration, caps, when) => ({ targets: { side, notKing }, cost, captures, uses: 0, duration, caps, when });
  const CARDS = [
    { id: 'Freeze', art: 'freeze', twin: 'frost', text: 'as your move, freeze an enemy piece (not the king): it cannot move on its next turn', f: CF('b', true, 'move', 'never', 'them', ['enemy, not king', 'your move', 'never takes', 'one card', 'their turn']) },

  function doneScene(sc, d) {

  /* ======================= WHY ======================= */
  function occupantAt(sc, q) { return sc.pieces.find((p) => p.sq === q && !p.ghost); }
  function whyData(sc, q) {
    if (sc.why && sc.why[q]) return sc.why[q];
    if (WHY[sc.id] && WHY[sc.id][q]) return WHY[sc.id][q];
    const m = sc.marks.find((x) => x.sq === q);
    const occ = occupantAt(sc, q);
    const occW = occ ? `${occ.side === 'b' ? 'Black' : 'White'} ${PNAME[occ.k] ? PNAME[occ.k].toLowerCase() : occ.k}` : 'Empty';
    const base = { occupant: cap(occW), icon: occ ? occ.k === 'custom' ? null : occ.k : null, side: occ ? occ.side : null };
    if (!m) {
      if (occ && occ.open) return { ...base, count: 0, solo: 'self', soloCap: 'The open piece.' };
      if (occ && occ.side === 'w') return { ...base, count: 0, solo: 'empty', soloCap: 'Its own piece.' };
      return { ...base, count: 0, solo: 'empty', soloCap: 'Out of reach.' };
    }
    const imps = (sc.impressions.find((i) => i.sq === q) || { list: [] }).list.map((x) => (x.a ? { a: x.a } : x.power ? { power: x.power } : { card: x.card }));
    const rail = sc.rails.find((r) => { const a = pq(r.from), b = pq(r.to), c = pq(q); const dx = Math.sign(b.f - a.f), dy = Math.sign(b.r - a.r); for (let i = 1; i < 8; i++) { const f = a.f + dx * i, r2 = a.r + dy * i; if (f === c.f && r2 === c.r) return true; if (f === b.f && r2 === b.r) break; } return false; });
    let railDir = null;
    if (rail) { const a = pq(rail.from), b = pq(rail.to); railDir = ({ '0,1': 'n', '1,1': 'ne', '1,0': 'e', '1,-1': 'se', '0,-1': 's', '-1,-1': 'sw', '-1,0': 'w', '-1,1': 'nw' })[`${Math.sign(b.f - a.f)},${Math.sign(b.r - a.r)}`]; }
    const names = { move: 'move', take: 'takes', both: 'move or take', shot: 'shot: takes from here', moveshot: 'move or shot', blocked: 'refused', 'blocked-move': 'refused' };
    const resultK = m.k;
    const sum = { base: { k: railDir ? 'move' : m.k === 'blocked' ? 'take' : m.k, rail: railDir }, imps, result: { k: resultK, cond: m.cond, xtag: !!(occ && /take|both|shot/.test(resultK)) }, captions: [] };
    sum.captions.push(railDir ? 'line' : names[sum.base.k] || m.k);
    for (const im of imps) sum.captions.push(im.a ? M.blockOf(im.a).short : im.power ? "king's power" : 'LAB card');
    sum.captions.push(m.cond === 'asleep' ? 'asleep here' : names[resultK] || resultK);
    if (!imps.length && !railDir) return { ...base, count: 1, solo: resultK, soloCond: m.cond, soloCap: cap(M.NAMES[resultK] || resultK) };

  }
  function moveHere(sc, q) {
    const op = sc.pieces.find((p) => p.open); if (!op) return null;
    const m = sc.marks.find((x) => x.sq === q);
    const w = WHY[sc.id] && WHY[sc.id][q];
    if (w && w.swap) return { to: q, swap: true };
    if (!m || /blocked/.test(m.k) || m.cond === 'asleep') return null;
    const occ = occupantAt(sc, q);
    if (m.k === 'take' && !occ) return null; // a take needs something to take
    if (m.diff === '-') return null;
    if (sc.id === 'paladin' && q === 'd7') return { to: q, kill: 'd7', removed: true, hop: 'd5' };
    if (m.k === 'shot' || m.k === 'moveshot' && occ) return occ ? { to: q, kill: q, shot: true } : null;
    return { to: q, kill: occ ? q : null, hop: sc.arches.some((a) => a.to === q || true) ? null : null };
  }

  function knotScene(sc) {

    ['stamped', 'My Pawn moves like a queen in the center'], ['asleep-b4', 'My Pawn on b4: queen lines sleep'], ['awake-e2', 'My Pawn on e2: step 2 wakes'],
    ['hero', 'Paladin, Why on d7'], ['hero-i1', 'Paladin: rule I alone'], ['hero-i2', 'Paladin: rule II alone'], ['hero-i3', 'Paladin: rule III alone'], ['why-g7', 'Paladin, Why on g7'],
    ['archer', 'Archer: shots'], ['beast', 'Beast: takes again'], ['beast-cancel', 'My Beast: one rule stops the other'], ['maester', 'Maester: swaps'], ['ogre', 'Ogre: pushes'], ['guard', 'Guard: threat stopped'],
    ['rook-leap', 'Rook + Mud king, Leap armed'], ['echo', 'Paladin + Leap: no change'], ['freeze-card', 'LAB card: Freeze on c6'], ['frost-power', 'Frost king: Freeze on c6'],
    ['kings', 'Kings tab: Mud king'], ['cards', 'Cards tab (LAB): Freeze'], ['card-salvation', 'LAB card: Salvation'], ['card-rescue', 'LAB card: Rescue'], ['rules', 'Rules tab: a seal'], ['phone-open', 'Phone: the opening'], ['phone-hero', 'Phone: the Paladin'],
  ];
  function openMenu() {
    const rmOn = document.documentElement.classList.contains('rm'), cbOn = document.documentElement.classList.contains('cb');
    $('#menu').innerHTML = `<div class="box"><h3>STATES</h3><p>Each link opens a named state (?state=id). Press M to close.</p><div class="grid">${STATES.map(([id, w]) => `<a href="?state=${id}"><b>${id}</b><small>${esc(w)}</small></a>`).join('')}</div>
      <div class="sws"><label><input type="checkbox" id="wdSw" ${document.documentElement.classList.contains('no-words') ? '' : 'checked'}> Words</label><label><input type="checkbox" id="rmSw" ${rmOn ? 'checked' : ''}> Reduced motion</label><label><input type="checkbox" id="cbSw" ${cbOn ? 'checked' : ''}> Colour check (deuteranopia)</label></div></div>`;
    $('#menu').classList.add('open');
    $('#wdSw').onchange = (e) => { document.documentElement.classList.toggle('no-words', !e.target.checked); render(); };
    $('#rmSw').onchange = (e) => document.documentElement.classList.toggle('rm', e.target.checked);
    $('#cbSw').onchange = (e) => document.documentElement.classList.toggle('cb', e.target.checked);
  }
  function closeMenu() { $('#menu').classList.remove('open'); }
  $('#menu').addEventListener('click', (e) => { if (e.target.id === 'menu') closeMenu(); });

  /* ======================= LAYOUT ======================= */
  function layout(forcePhone) {
    const html = document.documentElement;
    const w = window.innerWidth;
    PHONE = forcePhone || w < 700;
    html.classList.toggle('phone', PHONE);
    html.classList.toggle('phone-frame', PHONE && w >= 700);
    if (PHONE) {
      const bw = Math.min((w >= 700 ? 390 : w) - 32, 420);
      BS = bw / 8;
      $('#stage').style.transform = '';
    } else {
      BS = 80;
      const k = Math.min(w / 1440, window.innerHeight / 900);
      const kk = Math.max(0.55, Math.min(1, k));
      $('#stage').style.transform = kk < 1 ? `scale(${kk})` : '';
      $('#stage').style.left = kk < 1 ? `${Math.max(0, (w - 1440 * kk) / 2)}px` : `${Math.max(0, (w - 1440) / 2)}px`;
    }
  }
  let forced = false;
  window.addEventListener('resize', () => { const was = PHONE; layout(forced); if (was !== PHONE) $('#hits').innerHTML = ''; render(); });

  /* ======================= NAMED STATES ======================= */
  function applyState(id) {
    S = S0();
    const mypawn = () => { S.item = { k: 'copy', id: 'mypawn' }; S.yours = ['mypawn']; S.edited = true; S.opened = 2; S.design = { cells: { '0,1': 'move', '-1,1': 'both', '1,1': 'both' }, lines: [], step2: true }; S.undo = [{ scope: 'paint', s: Object.assign(S0(), {}) }]; };
    const piece = (p) => { S.item = { k: 'piece', id: p }; S.sq = Object.keys(PIECE[p].at)[0]; S.opened = 2; };
    switch (id) {
      case 'open': case 'phone-open': break;
      case 'paint': S.design = PAWN_DESIGN(); S.design.seals = [{ a: 'step2', when: { on: 'zone', zone: 'startRank' }, asleep: true }, { a: 'becomes', pill: 'choice', when: { on: 'reaches', zone: 'lastRank' } }]; S.mode = 'brush'; S.brush = 'both'; break;
      case 'painted': mypawn(); break;
      case 'stamp-preview': mypawn(); S.shelf = true; S.shelfSel = 'movesLike'; S.preview = true; break;
      case 'stamped': mypawn(); S.queen = true; S.design = null; S.undo.push({ scope: 'seal', s: S0() }); break;
      case 'asleep-b4': mypawn(); S.queen = true; S.design = null; S.sq = 'b4'; S.undo.push({ scope: 'seal', s: S0() }); break;
      case 'awake-e2': mypawn(); S.queen = true; S.design = null; S.sq = 'e2'; S.undo.push({ scope: 'seal', s: S0() }); break;
      case 'hero': case 'phone-hero': piece('paladin'); S.why = 'd7'; break;
      case 'hero-i1': piece('paladin'); S.focus = 0; break;
      case 'hero-i2': piece('paladin'); S.focus = 1; break;
      case 'hero-i3': piece('paladin'); S.focus = 2; break;
      case 'why-g7': piece('paladin'); S.why = 'g7'; break;
      case 'archer': piece('archer'); S.why = 'd6'; break;
      case 'beast': piece('beast'); S.why = 'e5'; break;
      case 'beast-cancel': S.item = { k: 'copy', id: 'mybeast' }; S.yours = ['mybeast']; S.beastPill = 'any'; S.edited = true; S.opened = 2; S.why = 'e5'; S.undo = [{ scope: 'rule', s: S0() }]; break;
      case 'maester': piece('maester'); S.why = 'e4'; break;
      case 'ogre': piece('ogre'); S.why = 'c3'; S.hover = 'd6'; break;
      case 'guard': piece('guard'); S.threats = true; break;
      case 'rook-leap': piece('rook'); S.king = 'mud'; S.armed = 'Leap'; S.why = 'd5'; break;
      case 'echo': piece('paladin'); S.king = 'mud'; S.armed = 'Leap'; break;
      case 'freeze-card': piece('paladin'); S.card = 'Freeze'; S.cardOn = 'c6'; S.threats = true; break;
      case 'frost-power': S.item = { k: 'king', id: 'frost' }; S.tab = 'kings'; S.king = 'frost'; S.armed = 'Freeze'; S.cardOn = 'c6'; S.spent.Freeze = 1; S.threats = true; S.opened = 2; break;
      case 'compare': mypawn(); break; // old link: a copy now always shows its changes
      case 'kings': S.item = { k: 'king', id: 'mud' }; S.tab = 'kings'; S.king = 'mud'; S.armed = 'Leap'; S.opened = 2; break;
      case 'cards': S.item = { k: 'card', id: 'Freeze' }; S.tab = 'cards'; S.card = 'Freeze'; S.threats = true; S.opened = 2; break;
      case 'card-salvation': S.item = { k: 'card', id: 'Salvation' }; S.tab = 'cards'; S.card = 'Salvation'; S.opened = 2; break;
      case 'card-rescue': S.item = { k: 'card', id: 'Rescue' }; S.tab = 'cards'; S.card = 'Rescue'; S.opened = 2; break;
      case 'rules': S.item = { k: 'seal', id: 'linesPass' }; S.tab = 'rules'; S.focus = 0; S.opened = 2; break;
      default: return false;
    }
    if (id.startsWith('phone')) S.tab = id === 'phone-hero' ? 'pieces' : 'pieces';
    return true;
  }

  /* ======================= BOOT ======================= */
  const params = new URLSearchParams(location.search);
  const st = params.get('state') || 'open';
  forced = st.startsWith('phone-');
  layout(forced);
  applyState(st) || applyState('open');
  M.ensureDefs();
  render();
  if (st === 'open' || st === 'phone-open') {
    // the Pawn steps from its ledge slot to d4, then its tiles ripple out
    const slot = document.querySelector('#ledge .slot[data-piece="pawn"]');
    if (slot) enterPiece(slot, 'd4', 'step');
  } else { FX.ripple = false; }
  window.PG = { S: () => S, render, applyState: (id) => { applyState(id); render(); }, sceneNow };
})();
</script>
</body>
