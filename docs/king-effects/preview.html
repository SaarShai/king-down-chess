<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King Effects Preview</title>
<style>
  :root { --bg: #efe9da; --ink: #2b2820; --muted: #6b6455; --card: #fbf8f0; --line: #d8cfba; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1b17; --ink: #ece6d6; --muted: #a39b88; --card: #27241f; --line: #3d382f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; padding: 20px 16px 40px; }
  header { max-width: 1240px; margin: 0 auto 16px; }
  h1 { font: 600 24px/1.2 Georgia, serif; margin: 0 0 6px; }
  header p { margin: 0 0 12px; color: var(--muted); max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  .controls label { display: inline-flex; gap: 6px; align-items: center; min-height: 32px; cursor: pointer; }
  #grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 1240px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-width: 100%; }
  .card h2 { font: 600 18px/1.2 Georgia, serif; margin: 0 0 8px; }
  .card p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 46ch; }
  .period { white-space: nowrap; }
  .frame { overflow: hidden; border-radius: 6px; max-width: 100%; }
  .frame canvas { display: block; }
  .labels { display: flex; justify-content: space-around; font-size: 13px; color: var(--muted); }
  .whole { max-width: 1240px; margin: 28px auto 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .whole h2 { font: 600 20px/1.2 Georgia, serif; margin: 0; }
  select { font: inherit; padding: 4px 6px; }
</style>
<header>
  <h1>King effects: preview</h1>
  <p>Each king on a light and a dark square, ivory army on the left and charcoal on the right. This is the game's own painted board and drawing code, at the size the game shows it. Nothing here is in the game yet.</p>
  <div class="controls" role="group" aria-label="Preview options">
    <span>Size:</span>
    <label><input type="radio" name="size" value="desktop" checked> Desktop game</label>
    <label><input type="radio" name="size" value="phone"> 390 px phone</label>
    <label><input type="radio" name="size" value="double"> 2× close-up</label>
    <label><input type="checkbox" id="animations" checked> Effects on</label>
  </div>
</header>
<main>
  <div id="grid"></div>
  <section class="whole">
    <h2>On a whole board</h2>
    <div class="controls">
      <label>White king <select id="white"></select></label>
      <label>Black king <select id="black"></select></label>
    </div>
    <div class="frame" id="board"></div>
  </section>
</main>
<script type="module" src="./preview.mjs"></script>
</html>
