<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore interactions · approval sample</title><link rel="stylesheet" href="/src/style.css"><style>
body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Alegreya Sans',sans-serif;font-size:17px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.shade{position:fixed;inset:0;background:#302a2266;display:grid;place-items:center;padding:14px;box-sizing:border-box}
.sheet{width:min(760px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--vellum);border:1px solid var(--stone-500);border-radius:12px;box-shadow:var(--shadow-float)}
header{position:sticky;top:0;background:var(--vellum);border-bottom:1px solid var(--stone-300);display:flex;align-items:center;justify-content:space-between;padding:14px 22px;z-index:1}
h1{font:600 22px 'Cinzel',serif;margin:0}h2{font:600 14px 'Cinzel',serif;letter-spacing:.06em;margin:0 0 12px}p{margin:0 0 14px;line-height:1.4}
.body{padding:22px}.note{font-size:15px;color:var(--ink-soft)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px}input,select,button{font:inherit;min-height:44px;box-sizing:border-box}input,select{width:100%;padding:9px;border:1px solid var(--stone-500);border-radius:5px;background:#fffdf8;color:var(--ink)}button{padding:9px 16px;border:1px solid var(--stone-500);border-radius:6px;background:var(--parchment);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:var(--vellum)}header button{font-size:23px;padding:0;width:44px;border:0;background:transparent}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.cost{padding:18px;border:1px solid var(--stone-300);border-radius:6px;margin:18px 0;background:var(--parchment)}.cost strong{font-size:24px}.cost p:last-child{margin:0}dl{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;margin:16px 0}dt{color:var(--ink-soft)}dd{margin:0}details{margin:20px 0}summary{cursor:pointer;min-height:32px}ul{padding-left:22px;line-height:1.5}.results{list-style:none;padding:0;margin:18px 0}.results li{border-top:1px solid var(--stone-300);padding:14px 0}.results label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}.results input{width:20px;min-height:22px;margin-top:2px}.results small{display:block;color:var(--ink-soft);font-size:15px}.crumb{display:flex;gap:6px;margin:0 0 18px}.crumb button{min-height:32px;font-size:14px;padding:3px 9px}.sample{padding:9px 22px;border-top:1px solid var(--stone-300);font-size:13px;color:var(--ink-soft)}.tag{font-size:13px;display:inline-block;border:1px solid var(--stone-300);border-radius:3px;padding:2px 6px;margin-left:5px}
@media(max-width:600px){.body{padding:18px}header{padding:10px 16px}h1{font-size:18px}.fields{gap:14px}.fields .wide{grid-column:1/-1}.actions button{flex:1}.cost strong{font-size:22px}.crumb{flex-wrap:wrap}dl{font-size:16px}}

.sample{position:sticky;bottom:0;background:var(--vellum);z-index:2}.crumb button{min-height:44px}.crumb select{width:auto;max-width:100%}.machine{padding:12px 0;border-bottom:1px solid var(--stone-300)}.machine strong{display:block}progress{width:100%;accent-color:var(--accent)}.status{color:var(--accent);font-weight:700}.actions a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent)}@media(max-width:600px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}dl{grid-template-columns:1fr 1fr;gap:8px}.sample{padding:9px 16px}.cost{padding:14px}}
</style><iframe src="./sample.html" title="Existing study board"></iframe><div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="heading"><header><h1 id="heading">Explore interactions</h1></header><div class="body"></div><div class="sample">Approval sample · all values are examples.<br>Controls do not scan, launch or save.</div></section></div><script type="module">
const states=['proposals','coverage','review','saved'];
const button=(name,state)=>`<button data-screen="${state}">${name}</button>`;
let confirmed=false,saved=false;
const views={
proposals:()=>`<p><strong>My Rook · study version 2</strong></p><p>Choose what to test next. Each proposal explains the gap it can fill.</p><div class="fields"><label>Scope<select><option>Movement, protection and extra actions</option></select></label><label>Scenario budget<select><option>24 drafts · no games</option></select></label></div><div class="cost"><strong>6 pairs · 24 obligations</strong><p>12 drafts proposed within your budget. Two impossible combinations are excluded with reasons. Triples are not included.</p></div><ul class="results"><li><strong>Protection + extra action</strong> <span class="tag">Timing gap</span><p>Check protection before and after the extra action ends. Test both sides and both orders.</p>${button('Inspect this gap','coverage')}</li><li><strong>Displacement + capture protection</strong> <span class="tag">Shared state</span><p>Test whether a protected target can be moved, then captured. Include a blocked destination.</p>${button('Inspect coverage','coverage')}</li><li><strong>Capture chain + piece return</strong> <span class="tag">Unsupported</span><p>Persistent piece identity is not available. Keep this gap visible.</p></li></ul><details><summary>Why these proposals?</summary><p>Changed items first, then timing and boundary gaps, then shared state. Every candidate and exclusion stays in the saved scope. A proposal is not a rule verdict.</p></details>`,
coverage:()=>`<p><strong>Protection + extra action</strong></p><p>These counts describe the declared scenario scope, not all possible game positions.</p><div class="cost"><strong>8 / 24 obligations passed</strong><p>${saved?3:2} failed · 5 draft · ${saved?5:6} missing · 1 unsupported · 2 stale</p><p>2 impossible combinations excluded separately. Triples not covered.</p></div><ul class="results"><li><strong>Protection expires after the extra action</strong> <span class="tag">${saved?'Failed':'Missing'}</span><p>Opposing sides · expiry boundary · ${saved?'reviewed regression disagrees with observation':'no reviewed check'}.</p>${button('Review nominated sequence','review')}</li><li><strong>Blocked displacement</strong> <span class="tag">Failed</span><p>A current saved check disagrees with its declared expectation. A later draft does not replace this failure.</p></li><li><strong>Capture after expiry</strong> <span class="tag">Stale</span><p>Old source. Re-run explicitly before counting this evidence.</p></li></ul><div class="actions">${button('Back to proposals','proposals')}</div>`,
review:()=>`<p><strong>Review a nominated sequence</strong> <span class="tag">Illustrative replay</span></p><p>A mark changes before turn ownership changes. This detector nominates a case; it does not prove which rule caused it.</p><div class="cost"><strong>Before → after</strong><p>Mark present → mark absent<br>Side to act: White → White<br>Extra action: available → spent</p></div><p class="note">Example data only. The board behind this sheet is the existing Rook study, not this nominated replay. The built view will show the verified replay board.</p><details><summary>Replay and source binding</summary><p>The built view retains the run, part, game, action index, source hash, complete rules and full prefix. Missing history blocks promotion.</p></details><label>Expected behavior<select><option>Protection remains until turn ownership changes</option></select></label><label style="margin-top:14px">Expectation basis<input value="Designer decision: review the expiry boundary" aria-label="Expectation basis"></label><p style="margin-top:14px">Observed behavior differs from the first expectation. Saving it creates a <strong>failing regression</strong>, not a corrected game rule.</p><label style="display:flex;align-items:center;gap:12px"><input id="confirm" type="checkbox" style="width:22px;min-height:22px" ${confirmed?'checked':''}>I reviewed the expected behavior and its basis.</label><div class="actions"><button class="primary" data-screen="saved" ${confirmed?'':'disabled'}>Save regression · sample</button>${button('Back to coverage','coverage')}</div>`,
saved:()=>`<p class="status">Regression saved · sample</p><h2>Protection at the turn boundary</h2><div class="cost"><strong>Check failed as expected</strong><p>The intended result stays separate from the observed result. The test preserves the disagreement.</p></div><p>New regression version 1. Parent study version 2 is unchanged. Original replay and full prefix remain linked.</p><p>Coverage: this obligation is now <strong>failed</strong>, not missing. The other gaps remain.</p><p class="note">This sample writes nothing. The built flow verifies persistence after reload and supports an atomic save failure.</p><div class="actions">${button('Return to coverage','coverage')}${button('Inspect the sequence','review')}</div>`
};
function show(state){document.querySelector('.body').innerHTML=`<nav class="crumb" aria-label="Discovery views">${states.map(x=>button(x[0].toUpperCase()+x.slice(1),x)).join('')}</nav>`+views[state]();document.querySelector('.sheet').scrollTop=0;window.sampleState=state;window.sampleReady=true;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-screen]');if(b&&!b.disabled){if(b.classList.contains('primary')&&b.dataset.screen==='saved')saved=true;show(b.dataset.screen)}});
document.addEventListener('change',e=>{if(e.target.id==='confirm'){confirmed=e.target.checked;document.querySelector('.primary').disabled=!confirmed;}});
show(states.includes(new URLSearchParams(location.search).get('state'))?new URLSearchParams(location.search).get('state'):'proposals');
</script></html>
