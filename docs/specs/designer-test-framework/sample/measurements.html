<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measurement controls · approval sample</title>
<link rel="stylesheet" href="/src/style.css">
<style>
body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Alegreya Sans',sans-serif;font-size:17px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.shade{position:fixed;inset:0;background:#302a2266;display:grid;place-items:center;padding:14px;box-sizing:border-box}
.sheet{width:min(760px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--vellum);border:1px solid var(--stone-500);border-radius:12px;box-shadow:var(--shadow-float)}
header{position:sticky;top:0;background:var(--vellum);border-bottom:1px solid var(--stone-300);display:flex;align-items:center;justify-content:space-between;padding:14px 22px;z-index:1}
h1{font:600 22px 'Cinzel',serif;margin:0}h2{font:600 14px 'Cinzel',serif;letter-spacing:.06em;margin:0 0 12px}p{margin:0 0 14px;line-height:1.4}
.body{padding:22px}.note{font-size:15px;color:var(--ink-soft)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px}input,select,button{font:inherit;min-height:44px;box-sizing:border-box}input,select{width:100%;padding:9px;border:1px solid var(--stone-500);border-radius:5px;background:#fffdf8;color:var(--ink)}button{padding:9px 16px;border:1px solid var(--stone-500);border-radius:6px;background:var(--parchment);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:var(--vellum)}header button{font-size:23px;padding:0;width:44px;border:0;background:transparent}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.cost{padding:18px;border:1px solid var(--stone-300);border-radius:6px;margin:18px 0;background:var(--parchment)}.cost strong{font-size:24px}.cost p:last-child{margin:0}dl{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;margin:16px 0}dt{color:var(--ink-soft)}dd{margin:0}details{margin:20px 0}summary{cursor:pointer;min-height:32px}ul{padding-left:22px;line-height:1.5}.results{list-style:none;padding:0;margin:18px 0}.results li{border-top:1px solid var(--stone-300);padding:14px 0}.results label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}.results input{width:20px;min-height:22px;margin-top:2px}.results small{display:block;color:var(--ink-soft);font-size:15px}.crumb{display:flex;gap:6px;margin:0 0 18px}.crumb button{min-height:32px;font-size:14px;padding:3px 9px}.sample{padding:9px 22px;border-top:1px solid var(--stone-300);font-size:13px;color:var(--ink-soft)}.tag{font-size:13px;display:inline-block;border:1px solid var(--stone-300);border-radius:3px;padding:2px 6px;margin-left:5px}
@media(max-width:600px){.body{padding:18px}header{padding:10px 16px}h1{font-size:18px}.fields{gap:14px}.fields .wide{grid-column:1/-1}.actions button{flex:1}.cost strong{font-size:22px}.crumb{flex-wrap:wrap}dl{font-size:16px}}
</style>
<iframe src="./sample.html" title="Existing study board"></iframe>
<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="heading"><header><h1 id="heading">Plan a measurement</h1><button aria-label="Close">×</button></header><div class="body"></div><div class="sample">Rendered approval sample · controls do not save or run games</div></section></div>
<script type="module">
const nav=`<nav class="crumb" aria-label="Sample views"><button data-screen="plan">Choose test</button><button data-screen="preview">Preview</button><button data-screen="link">Link results</button></nav>`;
const views={
plan:`<p>Choose what to measure for <strong>My Rook</strong>.</p><p class="note">Uses this study’s rules and design. New games start from the chosen army setup.</p><div class="fields"><label class="wide">Test<select><option>Piece activity</option><option>Piece worth</option><option>Power field</option><option>Two-factor interaction</option><option>Power cross-play</option></select></label><label class="wide">Army pool<select><option>My Rook only</option><option>Standard pool</option><option>Standard pool + My Rook</option><option>Custom pool</option></select></label><label>Pairs<input type="number" value="20" min="1"></label><label>Search depth<input type="number" value="2" min="1"></label></div><details><summary>More settings</summary><div class="fields"><label>Seed<input value="214211"></label><label>Game cap · plies<input value="300"></label><label>Random opening plies<input value="4"></label><label>Power search plies<input value="2"></label></div><p class="note">The complete rules and saved design stay fixed. Existing evaluation settings stay with the plan.</p></details><p class="note">Activity reports use, blocked turns, conditions and interactions. It does not establish fun or fair value.</p><div class="actions"><button class="primary" data-screen="preview">Preview plan</button><button data-screen="link">Link existing results</button></div>`,
preview:`<p><strong>Piece activity · My Rook</strong></p><div class="cost"><p><strong>40 games</strong> · 20 paired blocks</p><p>Each pair plays both colors with the same army and opening seed.</p></div><dl><dt>Army pool</dt><dd>My Rook only</dd><dt>Search depth</dt><dd>2</dd><dt>Seed</dt><dd>214211</dd><dt>Game cap</dt><dd>300 plies</dd><dt>Random opening</dt><dd>4 plies</dd><dt>Time and money</dt><dd>No measured estimate</dd></dl><details><summary>Full settings and support limits</summary><ul><li>The saved position is not replayed in population games.</li><li>Reports keep ordinary moves and special effects separate.</li><li>A result does not approve a new rule.</li></ul></details><p>Save this plan with the study, or edit its settings.</p><p class="note">Saving a plan starts no games. A campaign needs a separate run approval.</p><div class="actions"><button class="primary">Save plan</button><button data-screen="plan">Edit settings</button></div>`,
link:`<p>Choose a balance export, then select the measurements to keep with this study.</p><button>Choose result file</button><p class="note" style="margin-top:12px">Example file: measurements.json · 9 rows in the selected run. The file stays on this device.</p><label>Run<select><option>balance-target-powers-d3</option></select></label><ul class="results"><li><label><input type="checkbox" checked><span>Haste · power field <span class="tag">Valid</span><small>Score 0.549 · interval 0.507–0.592 · historical context</small></span></label></li><li><label><input type="checkbox" checked><span>Haste · activity <span class="tag">Unverified</span><small>0.720 uses per side · 880 games · raw source not checked here</small></span></label></li><li><label><input type="checkbox"><span>Haste · game length <span class="tag">Valid</span><small>101 plies · original method and source remain attached</small></span></label></li></ul><p class="note">2 selected. Original validity, intervals, rules and source hashes are kept. Linking does not make these results proof for My Rook.</p><div class="actions"><button class="primary">Link 2 measurements</button><button data-screen="plan">Cancel</button></div>`};
function show(name){document.querySelector('.body').innerHTML=nav+views[name];document.querySelector('#heading').textContent=name==='link'?'Link results':name==='preview'?'Preview measurement':'Plan a measurement';document.querySelector('.sheet').scrollTop=0;window.sampleReady=true}
document.addEventListener('click',event=>{const screen=event.target.closest('[data-screen]')?.dataset.screen;if(screen)show(screen)});
show(new URLSearchParams(location.search).get('state')||'plan');
</script></html>
