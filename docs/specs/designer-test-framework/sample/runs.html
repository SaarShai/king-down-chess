<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run a saved plan · approval sample</title><link rel="stylesheet" href="/src/style.css"><style>
body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Alegreya Sans',sans-serif;font-size:17px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.shade{position:fixed;inset:0;background:#302a2266;display:grid;place-items:center;padding:14px;box-sizing:border-box}
.sheet{width:min(760px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--vellum);border:1px solid var(--stone-500);border-radius:12px;box-shadow:var(--shadow-float)}
header{position:sticky;top:0;background:var(--vellum);border-bottom:1px solid var(--stone-300);display:flex;align-items:center;justify-content:space-between;padding:14px 22px;z-index:1}
h1{font:600 22px 'Cinzel',serif;margin:0}h2{font:600 14px 'Cinzel',serif;letter-spacing:.06em;margin:0 0 12px}p{margin:0 0 14px;line-height:1.4}
.body{padding:22px}.note{font-size:15px;color:var(--ink-soft)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px}input,select,button{font:inherit;min-height:44px;box-sizing:border-box}input,select{width:100%;padding:9px;border:1px solid var(--stone-500);border-radius:5px;background:#fffdf8;color:var(--ink)}button{padding:9px 16px;border:1px solid var(--stone-500);border-radius:6px;background:var(--parchment);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:var(--vellum)}header button{font-size:23px;padding:0;width:44px;border:0;background:transparent}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.cost{padding:18px;border:1px solid var(--stone-300);border-radius:6px;margin:18px 0;background:var(--parchment)}.cost strong{font-size:24px}.cost p:last-child{margin:0}dl{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;margin:16px 0}dt{color:var(--ink-soft)}dd{margin:0}details{margin:20px 0}summary{cursor:pointer;min-height:32px}ul{padding-left:22px;line-height:1.5}.results{list-style:none;padding:0;margin:18px 0}.results li{border-top:1px solid var(--stone-300);padding:14px 0}.results label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}.results input{width:20px;min-height:22px;margin-top:2px}.results small{display:block;color:var(--ink-soft);font-size:15px}.crumb{display:flex;gap:6px;margin:0 0 18px}.crumb button{min-height:32px;font-size:14px;padding:3px 9px}.sample{padding:9px 22px;border-top:1px solid var(--stone-300);font-size:13px;color:var(--ink-soft)}.tag{font-size:13px;display:inline-block;border:1px solid var(--stone-300);border-radius:3px;padding:2px 6px;margin-left:5px}
@media(max-width:600px){.body{padding:18px}header{padding:10px 16px}h1{font-size:18px}.fields{gap:14px}.fields .wide{grid-column:1/-1}.actions button{flex:1}.cost strong{font-size:22px}.crumb{flex-wrap:wrap}dl{font-size:16px}}

.sample{position:sticky;bottom:0;background:var(--vellum);z-index:2}.crumb button{min-height:44px}.crumb select{width:auto;max-width:100%}.machine{padding:12px 0;border-bottom:1px solid var(--stone-300)}.machine strong{display:block}progress{width:100%;accent-color:var(--accent)}.status{color:var(--accent);font-weight:700}.actions a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent)}@media(max-width:600px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}dl{grid-template-columns:1fr 1fr;gap:8px}.sample{padding:9px 16px}.cost{padding:14px}}
</style><iframe src="./sample.html" title="Existing study board"></iframe><div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="heading"><header><h1 id="heading">Run a saved plan</h1></header><div class="body"></div><div class="sample">Approval sample · all values are examples.<br>Controls do not launch or save.</div></section></div><script type="module">
let target='both';
const allocation=()=>target==='m1'?'M1: 40 games · blocks 1–20 · 8 workers':target==='kaggle'?'Kaggle: 40 games · blocks 1–20 · 4 workers · one notebook':'M1: 20 games · blocks 1–10 · 8 workers<br>Kaggle: 20 games · blocks 11–20 · 4 workers · one notebook';
const approval=()=>`I approve 40 games for My Rook, piece activity, plan v1, source 7c91e2a4, bundle b83f12cd, seed 214211, depth 2, on ${target==='both'?'M1 and Kaggle':target==='m1'?'M1':'Kaggle'}, with the split shown above and an eight-hour limit per machine, including remote setup and play.`;
const nav=`<nav class="crumb" aria-label="Sample views"><label>Sample view<select id="sample-view">${['approve','running','ready','review','linked','partial','disconnected','unknown','unavailable'].map(s=>`<option>${s}</option>`).join('')}</select></label></nav>`;
const actions=(label,state)=>`<div class="actions"><button class="primary" data-screen="${state}">${label}</button></div>`;
const details=`<details><summary>Plan and source details</summary><dl><dt>Study</dt><dd>My Rook · version 1</dd><dt>Test</dt><dd>Piece activity</dd><dt>Search depth</dt><dd>2</dd><dt>Seed</dt><dd>214211</dd><dt>Source</dt><dd>7c91e2a4</dd><dt>Bundle</dt><dd>b83f12cd</dd></dl><p>20 paired blocks. Each block keeps both colors together. No blocks overlap.</p></details>`;
function progress(terminal=false){
 const m1=target==='m1'?12:8, assigned=target==='m1'?40:20;
 const headline=terminal?'12 / 40 games':target==='m1'?'12 confirmed / 40 assigned':target==='kaggle'?'40 assigned · progress unknown':'8 reported / 40 assigned';
 return `<div class="cost"><strong>${headline}</strong><p>${terminal?'Terminal collected results':target==='both'?'Kaggle progress unknown':'Last observed completion'}</p></div>${target!=='kaggle'?`<div class="machine"><strong>M1 · ${m1} / ${assigned} games</strong><progress value="${m1}" max="${assigned}"></progress></div>`:''}${target!=='m1'?`<div class="machine"><strong>Kaggle · ${terminal?(target==='kaggle'?'12 / 40':'4 / 20')+' games':'Running · '+(target==='kaggle'?40:20)+' assigned'}</strong>${terminal?'':'<p>Game count is not available until output arrives.</p>'}</div>`:''}<p class="note" style="margin-top:14px">Last checked: 14 October, 10:32.<br>${terminal?'Run ended. No next check.':'Next bounded check: 11:32 (one-hour example).<br>Stored counts. Progress can change between checks.'}</p>`}

function view(state){return ({
approve:()=>`<p><strong>Piece activity · My Rook</strong></p><div class="cost"><strong>40 games</strong><p>20 paired blocks · depth 2</p></div><label>Run on<select id="target"><option value="m1">M1</option><option value="kaggle">Kaggle</option><option value="both">M1 and Kaggle</option></select></label><p id="allocation" style="margin-top:14px">${allocation()}</p><p class="note">Eight-hour limit per machine, including remote setup and play. Time and cost estimates are not measured.</p>${details}<p id="approval">${approval()}</p>${actions('Approve and start 40 games','running')}`,
running:()=>`<p class="status">Run accepted · in progress</p>${progress()}${details}<p class="note">This sample does not poll a service.</p>${actions('Sample: show collected results','ready')}`,
ready:()=>`<p class="status">Results collected and checked</p><div class="cost"><strong>40 / 40 games</strong><p>20 complete paired blocks</p></div><p>Source and plan match this study version. All assigned games are present.</p><details><summary>Check evidence</summary><ul><li>Source: 7c91e2a4 · bundle b83f12cd · plan v1.</li><li>Schedule: blocks 1–20, once each.</li><li>File hash: 91bd4c2e · matches collected files.</li><li>Replay: 40 games pass. Illegal-replay negative control passes.</li></ul><p>Example check evidence only.</p></details><p class="note">Backup: pending. Collection and checks are complete; backup is a separate step.</p>${actions('Review results','review')}`,
review:()=>`<p><strong>My Rook · piece activity</strong></p><p class="status">Source and plan checked · 40 games</p><label><span><input id="measurement" type="checkbox" checked style="width:20px;vertical-align:middle"> Select moved-piece fraction</span></label><dl><dt>Moved-piece fraction</dt><dd>0.62</dd><dt>95% army-bootstrap interval</dt><dd>0.41–0.83</dd><dt>Army blocks</dt><dd>20</dd></dl><p class="note">Example values. This is one measurement. This evidence does not adopt rules or establish fun.</p><p>Link creates a new study version. The results keep My Rook, version 1 as their origin. If the study changes, these results stay with the original version.</p>${actions('Link selected measurement','linked')}`,
linked:()=>`<p class="status">Measurement linked · sample</p><p>My Rook, version 2 now contains the measurement link. Its origin stays My Rook, version 1.</p><p class="note">The original plan, source and check evidence stay with the results.</p><div class="actions"><a href="./sample.html?state=results">Open original study results</a></div>`,
partial:()=>`<p class="status">Run ended · incomplete</p>${progress(true)}<p>12 collected games remain available. The run has missing games and incomplete paired blocks. These results do not meet the plan.</p><p class="note">Terminal partial results stay with this run. No retry starts here.</p>${details}`,
disconnected:()=>`<p class="status">Connection lost</p>${progress()}<p>The last observed state stays here. Reconnect reads the current run only.</p>${actions('Reconnect · read status','running')}`,
unknown:()=>`<p class="status">Submission outcome unknown</p><p>The service did not confirm whether it accepted this run. Keep this request and check its status before any new submission.</p><p class="note">No automatic retry or new submission. Next permitted reconciliation: 14 October, 11:32. The original request and plan stay fixed.</p>${details}${actions('Read cached status','unknown')}`,
unavailable:()=>`<p class="status">Local run service unavailable</p><p>Your saved plan stays with My Rook. A run cannot start while the local service is unavailable.</p>${details}${actions('Check service · sample','approve')}`
})[state]()}
function show(state){document.querySelector('.body').innerHTML=nav+view(state);document.querySelector('#sample-view').value=state;if(state==='approve')document.querySelector('#target').value=target;document.querySelector('.sheet').scrollTop=0;window.sampleState=state;window.sampleReady=true}
document.addEventListener('change',e=>{if(e.target.id==='sample-view')show(e.target.value);if(e.target.id==='target'){target=e.target.value;document.querySelector('#allocation').innerHTML=allocation();document.querySelector('#approval').textContent=approval()}if(e.target.id==='measurement')document.querySelector('[data-screen="linked"]').disabled=!e.target.checked});
document.addEventListener('click',e=>{const screen=e.target.closest('[data-screen]')?.dataset.screen;if(screen)show(screen)});
const state=new URLSearchParams(location.search).get('state')||'approve';show(['approve','running','ready','review','linked','partial','disconnected','unknown','unavailable'].includes(state)?state:'approve');
</script></html>
