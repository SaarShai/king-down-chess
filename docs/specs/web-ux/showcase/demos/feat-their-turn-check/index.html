<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Their turn and check</title>
<script src="../../kit/frame.js"></script>
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/ui.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="ttc-ember-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb070" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#e8692c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e8692c" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div class="app">
  <section class="strip opp" id="opp" aria-label="Your opponent">
    <span class="face">
      <span class="avatar" style="--art: url('../../assets/kings/flame-b.webp'); --at: 56% 3%"></span>
      <svg class="think-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" pathLength="100"/></svg>
    </span>
    <span class="who">
      <span class="name">Flame <span>· Computer</span></span>
      <span class="sub" id="opp-sub">Club</span>
    </span>
    <span class="power" id="opp-power" role="img" aria-label="Their power: Strike, 1 left">
      <img src="../../assets/emblems/flame.webp" alt="" width="30" height="30">
      <span aria-hidden="true"><b>Strike</b><small id="opp-left">1 left</small></span>
    </span>
  </section>

  <div class="board" id="board"></div>

  <section class="strip you" id="you" aria-label="You">
    <span class="face">
      <span class="avatar" style="--art: url('../../assets/kings/frost.webp'); --at: 62% 1%"></span>
    </span>
    <span class="who">
      <span class="name">You <span>· Frost</span></span>
      <span class="sub" id="you-sub">White</span>
    </span>
    <button type="button" class="btn btn-quiet power" id="freeze" aria-pressed="false">
      <img src="../../assets/emblems/frost.webp" alt="" width="30" height="30">
      <span><b>Freeze</b><small id="you-left">1 left</small></span>
    </button>
  </section>

  <div class="side">
    <section class="context" id="context" aria-live="polite" aria-atomic="true">
      <p class="status" id="status">Your move</p>
      <p class="detail" id="detail"></p>
    </section>
    <button type="button" class="moves-line" id="moves-line" aria-haspopup="dialog">
      <span id="moves-icon"></span><span>Moves</span><span class="last" id="moves-last"></span>
    </button>
    <nav class="bar" aria-label="Game">
      <button type="button" class="btn btn-quiet" id="hint"></button>
      <button type="button" class="btn btn-quiet" id="undo"></button>
      <button type="button" class="btn btn-quiet" id="menu" aria-haspopup="dialog"></button>
    </nav>
  </div>
</div>

<dialog class="sheet" id="moves-sheet" aria-labelledby="moves-title">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2 id="moves-title">Moves</h2><button type="button" class="btn btn-icon" data-close aria-label="Close"></button></div>
  <div class="sheet-body"><ol class="story" id="story"></ol></div>
</dialog>

<dialog class="sheet" id="menu-sheet" aria-labelledby="menu-title">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2 id="menu-title">Menu</h2><button type="button" class="btn btn-icon" data-close aria-label="Close"></button></div>
  <div class="sheet-body">
    <button type="button" class="btn btn-wide" id="new-game">New game</button>
    <h3>Feel</h3>
    <label class="row"><span>Sound and buzz<small>Check: one low note and two short buzzes.</small></span><input type="checkbox" class="toggle" id="sound"></label>
    <h3>Demo only</h3>
    <label class="row"><span>Lift their piece before it moves<small>Option A is on. Option B is off.</small></span><input type="checkbox" class="toggle" id="tell" checked></label>
  </div>
</dialog>

<script type="module" src="demo.js"></script>
</body>
</html>
