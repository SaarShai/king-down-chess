<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King powers</title>
<script src="../../kit/frame.js"></script>
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/ui.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="app" id="app" data-option="A">
  <section class="strip them" id="them" aria-label="Your opponent"></section>
  <div class="board" id="board"></div>
  <section class="strip you" id="you" aria-label="You"></section>
  <section class="ctx" id="ctx" aria-label="Game status">
    <div class="ctx-main">
      <div class="ctx-head">
        <p class="ctx-line" id="ctx-line" role="status" aria-live="polite">Your move</p>
        <button type="button" class="btn btn-quiet ctx-cancel" id="cancel" hidden>Cancel</button>
      </div>
      <div class="ctx-sub" id="ctx-sub"></div>
    </div>
  </section>
  <nav class="bar" aria-label="Game">
    <button type="button" class="btn btn-quiet" id="hint"></button>
    <button type="button" class="btn btn-quiet" id="undo"></button>
    <button type="button" class="btn btn-quiet" id="menu"></button>
  </nav>
</div>
<script type="module" src="demo.js"></script>
</body>
</html>
