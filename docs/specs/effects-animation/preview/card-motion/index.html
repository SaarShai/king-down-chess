<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card motion</title>
<style>
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: #eee6d6; color: #2b2621; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; }
  .frame { position: relative; overflow: hidden; }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sheet { width: 360px; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; }
  .tile { width: 139px; aspect-ratio: 16 / 9; border-radius: 8px; }
  .coin { width: 38px; height: 38px; border-radius: 50%; background: #3b3530; border: 3px solid #b08c3a; }
</style>
<div id="cards"></div>
<script type="module" src="./main.ts"></script>
