</style></head><body><nav><b>KING DOWN · WORKSHOP STUDY</b><a href="?variant=A">A · Board first</a><a href="?variant=B">B · Step by step</a><a href="?variant=C">C · Piece card</a></nav><main><div class="title"><span class="label" id="label"></span><h1 id="title"></h1></div><p class="reason" id="reason"></p><div class="frames"><div><div class="frame-label desktop-label"><span>DESKTOP · 1280 × 900</span><span>Editing a piece</span></div><div class="desktop"><iframe id="desktop" title="Desktop static mockup"></iframe></div><div class="device-links"><a id="desktop-link">Open at full size</a><a id="home-link">View Workshop home</a><a id="try-link">View Try it</a></div></div><div><div class="frame-label"><span>PHONE · 390 × 700</span><span id="phone-state">Editing a piece</span></div><div class="phone"><iframe id="phone" title="Phone static mockup"></iframe></div><div class="notes" style="display:block"><b id="strength"></b><p id="tradeoff"></p></div></div></div><div class="flow"><span class="key">Start</span><span>→</span><span id="flow"></span></div><div class="view-more" id="more"></div><p class="stamp">Static design options. App controls do not work. Existing game art. No new game rules. No motion.</p></main><script>
const v=['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
const data={A:{title:'Board first',label:'A · RECOMMENDED',reason:'Put the board at the centre. Keep the controls close. Switch from editing to trying in one step.',strength:'Best for making and testing ideas.',tradeoff:'The piece has less space for display. Open Look to see it in detail.',flow:'Choose a piece → Edit moves, rules or look ↔ Try it → Share'},B:{title:'Step by step',label:'B · GUIDED',reason:'Ask one question at a time. Show the path from a known piece to a new design.',strength:'Best for a first visit.',tradeoff:'Each step is clear. A skilled player must move between more screens.',flow:'Choose a piece → Moves → Rules → Look and name → Review · Try it at any step'},C:{title:'Piece card',label:'C · COLLECTIBLE',reason:'Make the complete design easy to read. Edit each part from the card. Keep the painted piece in view.',strength:'Best for reading and sharing designs.',tradeoff:'On a phone, Edit opens the board in a sheet. Frequent move changes need more taps.',flow:'Choose a piece → Edit the card ↔ Try it → Share'}}[v];
