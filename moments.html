<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <title>Painted moments · King Down</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; color: #262e2c; background: #f7f5ed; font: 16px/1.4 system-ui, sans-serif; }
    main { max-width: 420px; margin: auto; padding: 16px; }
    h1 { margin: 0 0 16px; font-size: 24px; }
    #stage { position: relative; display: grid; place-items: center; height: 164px; background: #e5dfcf; border-radius: 8px; }
    #square { position: relative; width: 80px; height: 80px; background: #d4c7ab; margin-top: 32px; }
    #figure { position: absolute; left: 50%; bottom: 0; height: var(--body-height, 90px); transform: translateX(-50%); }
    .controls { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; margin-top: 12px; }
    button, select { width: 100%; min-height: 44px; border: 1px solid #82765e; border-radius: 8px; padding-inline: 8px; color: inherit; background: #fffdf5; font: inherit; }
    select { height: 44px; }
    button:enabled { cursor: pointer; }
    button:disabled { opacity: .55; }
    #status { min-height: 1.4em; margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Painted moments</h1>
    <div id="stage" aria-hidden="true"><div id="square"><img id="figure" alt=""></div></div>
    <div class="controls">
      <label>Figure <select id="bank"></select></label>
      <label>Motion <select id="motion"><option value="normal">Normal</option><option value="fast">Fast</option><option value="reduce">Reduced</option></select></label>
      <button id="play" type="button">Play</button>
      <button id="skip" type="button" disabled>Skip</button>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="/src/interface/moments/demo.ts"></script>
</body>
</html>
